<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>video-cut 검토</title>
<style>
  :root {
    /* Vercel-inspired light, high-contrast canvas (see docs/design-system.md) */
    --bg: #ffffff; --panel: #fafafa; --surface-2: #f5f5f5; --ink: #171717; --muted: #666666; --line: #ebebeb; --line-strong: #a1a1a1;
    --cut: #a1a1a1; --proposal-bg: #ffefcf; --proposal-line: #ab570a;
    --gauge-bg: #f0f0f0; --gauge-fill: #d4d4d4; --gauge-user: #0070f3; --gauge-rule: #a1a1a1;
    --accent: #0070f3; --accent-soft: #d3e5ff; --accent-ink: #ffffff; --accent-strong: #0066dd;
    --danger: #ee0000; --danger-soft: #f7d4d6; --danger-ink: #ffffff;
    --select: #0070f3; --select-soft: #d3e5ff;
    --chip: rgba(0,0,0,0.045); --chip-hover: rgba(0,0,0,0.08);
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 9999px;
    --sidebar-w: 248px; --video-w: clamp(200px, 24vw, 420px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 15px/1.5 -apple-system, "Geist", "Inter", "Pretendard", "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent); }
  kbd { display: inline-block; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,0.06); font-size: 11px; color: var(--muted); font-family: var(--mono); }

  /* ---------------------------------------------------------------- layout shell */
  #app { display: flex; height: 100vh; }

  /* ---------------------------------------------------------------- sidebar (always visible) */
  #sidebar { width: var(--sidebar-w); flex: 0 0 auto; height: 100vh; overflow: hidden; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #sidebar .pad { padding: 16px 16px 6px; }
  /* undo/redo, search, 확정 and the N/M 완료 count need to stay reachable while burning down the
     review queue via J (usability review 2026-09-29) - previously done by making the whole
     sidebar one scroller with this block position:sticky, but a single native scrollbar then
     spans the sidebar's full height and visibly runs behind this "fixed" header too (user
     report 2026-09-29). #sidebarHead now simply never scrolls (flex:0 0 auto, no overflow of
     its own); only #sidebarScroll below it does, with its own contained scrollbar. */
  #sidebarHead { flex: 0 0 auto; background: var(--panel); }
  #sidebarScroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  #reviewProgress:not(:empty) { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #sidebar h1 { font-size: 14px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .history-row { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .icon-btn { width: 26px; height: 26px; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-full); border: none; background: var(--chip); color: var(--ink); font-size: 14px; line-height: 1; }
  .icon-btn:hover:not(:disabled) { background: var(--chip-hover); }
  .icon-btn:disabled { color: var(--muted); opacity: 0.4; cursor: default; }
  .duration-row { display: flex; align-items: flex-end; gap: 10px; margin-top: 14px; }
  .duration-row .stat { display: flex; flex-direction: column; gap: 2px; }
  .duration-row .stat-lbl { font-size: 10.5px; color: var(--muted); }
  .duration-row .stat-val { font-size: 14px; font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
  .duration-row .arrow { color: var(--muted); font-size: 13px; padding-bottom: 2px; }
  .duration-row .edited .stat-val { color: var(--accent-strong); font-weight: 700; font-size: 16px; }  /* --accent at 16px is 4.4:1 on the panel - one step darker passes AA */
  .actions { margin-top: 12px; }
  .actions button.primary { width: 100%; background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: var(--r-full); font-weight: 600; font-size: 13.5px; padding: 10px 9px; }
  .actions button.primary:hover { filter: brightness(1.06); }
  .divider { height: 1px; background: var(--line); margin: 2px 16px; }
  .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 12px 16px 6px; }

  /* ---------------------------------------------------------------- transcript search */
  #searchRow { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  #searchBox { flex: 1; font: inherit; font-size: 12.5px; padding: 6px 9px; border: 1px solid var(--line);
    border-radius: var(--r-sm); background: var(--panel); color: var(--ink); }
  #searchBox:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  #searchStatus { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .tok.w.search-hit { background: var(--accent-soft); border-radius: 3px; }
  .tok.w.search-hit.search-cur { background: var(--accent); color: var(--accent-ink); }

  /* ---------------------------------------------------------------- pattern-generalization suggestion
     (PLAN.md 12장/사용자 프로세스 #2) - distinct from review-card's yellow (that's "needs a
     decision"); this is blue like the accent, "here's something I noticed", advisory not urgent */
  #suggestionPanel { padding: 0 16px; }
  .suggestion-card { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--r-md);
    padding: 9px 10px; margin-bottom: 8px; font-size: 12.5px; }
  .suggestion-card .sg-head { font-size: 10.5px; font-weight: 700; color: var(--accent); margin-bottom: 3px;
    text-transform: uppercase; letter-spacing: 0.03em; }
  .suggestion-card .sg-text { color: var(--ink); line-height: 1.45; margin-bottom: 6px; }
  .suggestion-card .sg-n { color: var(--muted); font-size: 11px; }
  .suggestion-card .sg-btns { display: flex; gap: 6px; margin-top: 6px; }
  .suggestion-card .sg-btns button { font-size: 12px; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .suggestion-card .sg-btns button.ok { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* review panel: the sidebar's queue of every REVIEW-routed NG item + speaker block, always
     shown (decided or not) with its own status - a queue you can audit, not a list that
     silently empties. Clicking the card body selects its words and opens the work panel
     (#pop) for listening/precision editing, but the decisions - 건너뛰기 / 검토 완료 / ★
     (ng cards only) - live on the card as its own buttons (.rc-actions), not in the popup:
     검토 완료 accepts whatever state the item is in right now (even a partial 정밀 조정 edit)
     without requiring an exact-range reselect, which a popup-only decide button couldn't do. */
  #reviewPanel { padding: 0 16px 4px; }
  #reviewPanel .empty-hint { font-size: 12px; color: var(--muted); padding: 2px 0 8px; }
  /* Completed/skipped cards recede into this drawer instead of sitting inline among what's
     still open - the queue you actually work from (via J) stays short, and anything already
     decided is still one click away, not gone. Sits first in #reviewPanel, i.e. at the top of
     the 검토 필요 list (user request 2026-09-29). display:none (not max-height/overflow) when
     collapsed so its cards' buttons drop out of Tab order for free - see the H-FOCUS lesson on
     #pausePanel above. */
  #reviewDoneDrawer { margin-bottom: 8px; }
  #reviewDoneHead { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel);
    color: var(--ink); font-size: 12.5px; font-weight: 600; text-align: left; }
  #reviewDoneHead:hover { border-color: var(--line-strong); }
  #reviewDoneHead .n { color: var(--muted); font-weight: 400; margin-left: 5px; }
  #reviewDoneHead .chev { color: var(--muted); font-size: 11px; transition: transform 160ms ease; }
  #reviewDoneHead[aria-expanded="true"] .chev { transform: rotate(90deg); }
  #reviewDoneBody { display: none; }
  #reviewDoneBody.open { display: block; margin-top: 8px; }
  .review-card { border: 1px solid var(--proposal-line); background: var(--proposal-bg); border-radius: var(--r-md);
    padding: 8px 9px; margin-bottom: 8px; font-size: 12.5px; cursor: pointer; transition: box-shadow 120ms ease, opacity 120ms ease; }
  .review-card.active { box-shadow: 0 0 0 2px var(--accent); }
  .review-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .review-card.st-done_cut, .review-card.st-done_keep, .review-card.st-auto, .review-card.st-skipped, .review-card.st-pattern {
    background: var(--panel); border-color: var(--line); }
  /* resolved cards recede through colour, not opacity - 0.7 opacity took the muted labels
     below AA contrast (UX audit a11y) */
  .review-card.st-done_cut .rc-text, .review-card.st-done_keep .rc-text, .review-card.st-auto .rc-text,
  .review-card.st-skipped .rc-text, .review-card.st-pattern .rc-text { color: var(--muted); }
  .review-card .rc-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
  .review-card .rc-type { font-size: 10.5px; font-weight: 700; color: var(--proposal-line); }
  .review-card.st-done_cut .rc-type, .review-card.st-done_keep .rc-type,
  .review-card.st-auto .rc-type, .review-card.st-skipped .rc-type,
  .review-card.st-pattern .rc-type { color: var(--muted); }
  .review-card .rc-status { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .review-card .rc-outtake { font-size: 10.5px; color: var(--proposal-line); margin-bottom: 3px; }
  .review-card .rc-text { color: var(--ink); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .review-card .rc-actions { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .review-card .rc-actions button { font-size: 11.5px; padding: 4px 9px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); white-space: nowrap; flex: 0 0 auto; }
  .review-card .rc-actions button.ok { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .review-card .rc-actions button:hover { filter: brightness(1.06); }
  #reviewProgress { font-size: 11px; color: var(--muted); margin: -2px 16px 4px; }
  #reviewEstimate { font-size: 11px; color: var(--muted); margin: -2px 16px 4px; }
  #reviewPersonalized { font-size: 11px; color: var(--muted); margin: -2px 16px 8px; }

  /* accordion: one compact line up near the title/confirm button - most sessions never need
     to touch the tuning inputs, so the header alone (name + live summary) is all that shows */
  #pauseAccordion { margin-top: 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  #pauseHead { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 2px; background: none; border: none; text-align: left; }
  #pauseHead .pz-title { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  #pauseHead .pz-title span#pzHeadSub { color: var(--muted); font-weight: 400; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  #pauseHead .chev { color: var(--muted); font-size: 11px; transition: transform 160ms ease; }
  #pauseHead[aria-expanded="true"] .chev { transform: rotate(90deg); }
  #pausePanel { padding: 0; overflow: hidden; max-height: 0; transition: max-height 200ms ease; }
  #pausePanel.open { padding: 2px 0 10px; max-height: 480px; }
  .pause-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 8px; }
  .pause-row label { flex: 1; color: var(--ink); }
  .pause-row .n { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .pause-row input[type=number] { width: 56px; font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  #pzToggle { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 12px; }
  #pzResetAll { width: 100%; margin-top: 6px; padding: 7px; border-radius: 8px; border: 1px dashed var(--line); background: none; font-size: 12px; color: var(--muted); }
  #pzResetAll:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------------------------------------------------------------- video (top-right, large) */
  #videoWrap { position: fixed; top: 20px; right: 20px; width: var(--video-w); z-index: 8; border-radius: 14px;
    overflow: hidden; box-shadow: 0 20px 50px -12px rgba(0,0,0,0.7), 0 0 0 1px var(--line); background: #000; }
  video { width: 100%; display: block; aspect-ratio: 16/9; background: #000; }
  #videoBar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #171717; }
  #videoBar button { background: #ffffff14; color: #fff; border: 1px solid #ffffff20; border-radius: 6px; font-size: 12px; padding: 4px 10px; }
  #videoBar button:hover { background: #ffffff22; }
  #playInfo { color: #ffffff88; font-size: 11px; flex: 1; text-align: right; }

  /* ---------------------------------------------------------------- transcript (center, scrolls) */
  #main { flex: 1; height: 100vh; overflow-y: auto; }
  /* Left-anchored, not centered: centering an 880px column inside #main (which spans from
     the sidebar to the window's right edge) left a large dead gap next to the sidebar for
     no reason - the reading column doesn't need to be full width, but it should still start
     close to the panel that acts on it. */
  #transcript { max-width: 880px; margin: 0; padding: 28px 40px 260px 36px; }
  /* Video floats over the top-right corner only - reserving right padding for the whole
     column would starve every line below it too, which is what made the text column too
     narrow. A one-time top spacer (sized in JS to the video's rendered height) clears the
     first lines instead; every line after that gets the full column width. */
  #topSpacer { float: right; width: 1px; }
  @media (max-width: 680px) { #videoWrap { display: none; } #topSpacer { display: none; } }
  /* Below ~1700px the 880px column plus the sidebar reaches under the fixed video, so the
     top spacer alone isn't enough: every line scrolled up behind the video got hidden (UX
     audit H5). Reserve the video's column for the whole transcript at those widths. */
  @media (min-width: 681px) and (max-width: 1700px) {
    #transcript { margin-right: calc(var(--video-w) + 44px); }
    #topSpacer { display: none; }
  }
  /* ---------------------------------------------------------------- scroll progress (script reading position) */
  /* Sticky to #main itself (the column that actually scrolls), not the viewport - it then
     reads #main's own scrollTop/scrollHeight and needs no coordinate math relative to the
     sidebar or the floating video. Sits at the very top of the script column, under the
     video's fixed 20px top offset, so nothing ever overlaps it. The hit area is 24px tall
     (WCAG 2.2 AA Target Size minimum for a web pointer target) even though the visible track
     stays a thin 3px - both centered so the click/drag target is generous without looking
     heavy. Needs its own opaque background (page bg, not transparent) - a sticky element still
     only reserves its own box in the flow, so text scrolling past underneath would otherwise
     show straight through the gaps around the thin track/ticks instead of disappearing behind
     it. Ticks mark where pending review items sit ahead - not just "how far", but "how much is
     left to decide and where" (PLAN.md 검토 필요 큐) - each one individually clickable (a
     narrower 10px target than the bar itself, but the same jump lives on the full-size review
     cards in the sidebar, so this is a shortcut, not the only way in - WCAG 2.2's Target Size
     exception for an equivalent same-size control elsewhere on the page applies). The bar
     overall doubles as a click/drag seek bar like the video's own scrubber. */
  #scrollProgress { position: sticky; top: 0; left: 0; width: 100%; height: 24px; z-index: 7; cursor: pointer; background: var(--bg); }
  #scrollProgress .track { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    height: 3px; border-radius: 2px; background: var(--line); }
  #scrollProgressFill { position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    height: 3px; border-radius: 2px; background: var(--accent); width: 0%; transition: width 80ms linear; pointer-events: none; }
  /* Each tick's real hit box (10px) is wider than its visible mark (2px) - a mouse only needs
     to land near the mark, not exactly on it, and it's what makes the title tooltip reachable. */
  #scrollProgress .tick { position: absolute; top: 50%; width: 10px; height: 16px; transform: translate(-50%, -50%);
    pointer-events: auto; cursor: pointer; }
  #scrollProgress .tick::after { content: ''; position: absolute; left: 50%; top: 2px; bottom: 2px; width: 2px;
    transform: translateX(-50%); border-radius: 1px; background: var(--proposal-line); }
  #scrollProgress .tick.done::after { background: var(--line-strong); }
  #scrollProgress:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .para { margin: 0 0 14px; font-size: 17px; line-height: 1.85; }
  .tok { border-radius: 3px; padding: 1px 0; }
  .w { cursor: text; }
  .w.cut { text-decoration: line-through; text-decoration-color: var(--cut); color: var(--cut); cursor: pointer; }
  /* a word only PART of which is cut (or restored) by a 정밀 삭제/복원: the strike (red) or
     the restored stretch (blue underline) is drawn over exactly that fraction of the word -
     segment geometry is set inline per word in applyStates() */
  .w.partcut { background-repeat: no-repeat; }
  .tok.sel { background: var(--select-soft) !important; outline: 2px solid var(--select); }
  /* live playback position: as the video plays, the word under the playhead lights up so
     you can always see exactly where you are - independent of selection/cut state */
  .tok.w.playing { background: var(--accent-soft); box-shadow: 0 0 0 1px rgba(0,112,243,0.35); border-radius: 4px; }

  /* pause gauge: width ∝ pause length, fill = kept part */
  .g { display: inline-block; position: relative; height: 15px; vertical-align: -3px; margin: 0 4px; border-radius: 4px;
    background: var(--gauge-bg); cursor: ew-resize; user-select: none; overflow: hidden; }
  .g .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gauge-fill); }
  .g.user .fill { background: var(--gauge-user); }
  .g.rule .fill { background: var(--gauge-rule); }
  .g.cut { background: repeating-linear-gradient(45deg, var(--line), var(--line) 3px, var(--bg) 3px, var(--bg) 6px); cursor: pointer; }
  .g.cut .fill { display: none; }
  .g .lbl { position: absolute; inset: 0; font-size: 10px; line-height: 15px; text-align: center; color: var(--ink); pointer-events: none; white-space: nowrap;
    font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .g.user .lbl { color: var(--accent-ink); }
  .g.dragging { outline: 2px solid var(--accent); }
  .g.sel { outline: 2px solid var(--select); }

  /* ---------------------------------------------------------------- draggable popup chrome */
  .drag-handle { height: 12px; margin: -2px -2px 4px; cursor: move; display: flex; align-items: center; justify-content: center; user-select: none; }
  .drag-handle::after { content: ''; width: 28px; height: 3px; border-radius: 2px; background: var(--line); }
  .drag-handle:hover::after { background: var(--muted); }

  /* ---------------------------------------------------------------- popup */
  /* Anchored in the empty column under the video rather than floating next to whatever was
     clicked: one predictable spot, and it reuses space nothing else was using. The selected
     text scrolls up to meet it (see positionPopUnderVideo/select) instead of the popup
     chasing the selection around the page. */
  #pop { position: fixed; display: none; z-index: 10; background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 16px 40px -12px rgba(0,0,0,0.18); padding: 10px 12px; flex-direction: column; gap: 8px; overflow-y: auto; }
  #pop .hint { font-size: 12px; color: var(--muted); }
  #pop .why { font-size: 13px; line-height: 1.5; }
  #pop .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  #pop .btns button { font-size: 12px; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  #pop .btns button.danger { background: var(--danger); color: var(--danger-ink); border-color: var(--danger); }
  #pop .btns button.ok { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #pop .btns button:hover { filter: brightness(1.1); }
  /* review-mode: opened from a 검토 필요 card. The work panel is the same panel a plain
     manual selection uses - every tool (듣기/이음새/정밀 조정/★) stays available either way,
     so nothing about how you refine a cut differs by where the selection came from. The only
     review-specific addition is the type/status row - 건너뛰기/검토 완료 live on the sidebar
     card itself (.rc-actions below), not here. */
  #pop .rc-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; }
  #pop .rc-meta .rc-type { font-weight: 700; color: var(--proposal-line); }
  #pop .rc-meta .rc-status { color: var(--muted); }

  #gtip { position: fixed; display: none; z-index: 11; background: #171717; color: #ffffff; font-size: 12px; padding: 5px 9px;
    border-radius: 7px; pointer-events: none; white-space: nowrap; line-height: 1.5; font-family: var(--mono); }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 20; }
  #modal .box { position: fixed; background: var(--bg); border: 1px solid var(--line); padding: 22px 26px; border-radius: 14px; min-width: 420px; max-width: 640px; line-height: 1.6;
    box-shadow: 0 24px 60px -14px rgba(0,0,0,0.25); }
  #modal .box .drag-handle { margin: -8px -12px 10px; }
  #modal .box h2 { margin-top: 0; font-size: 16px; }
  #modal .box button { margin-top: 10px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  code { background: var(--surface-2); color: var(--ink); font-family: var(--mono); padding: 2px 6px; border-radius: 5px; font-size: 12px; }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #171717; color: #ffffff;
    padding: 9px 16px; border-radius: 9px; font-size: 13px; display: none; z-index: 30; }

  /* ---------------------------------------------------------------- help popup (shortcuts) */
  /* bottom-right corner sits empty otherwise (video is top-right, sidebar+transcript take
     the rest) - fixed placement here, independent of sidebar scroll, keeps it reachable */
  #btnHelp { position: fixed; z-index: 25; right: 20px; bottom: 20px; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--bg); box-shadow: 0 6px 16px -4px rgba(0,0,0,0.18);
    color: var(--muted); font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  #btnHelp:hover { border-color: var(--accent); color: var(--accent); }
  #helpPop { position: fixed; z-index: 25; right: 20px; bottom: 64px; width: 300px; background: var(--bg);

    display: none; opacity: 0; transform: scale(0.92) translateY(6px); transform-origin: bottom right;
    transition: opacity 160ms cubic-bezier(.2,.8,.2,1), transform 220ms cubic-bezier(.2,.8,.2,1); }
  #helpPop.show { display: block; opacity: 1; transform: scale(1) translateY(0); }
  #helpPop h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
  #helpPop .drag-handle { margin: -6px -8px 4px; }
  #helpPop .row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; padding: 4px 0; color: var(--ink); }
  #helpPop .row span:first-child { color: var(--muted); }

  /* ---------------------------------------------------------------- fine-boundary zoom panel */
  #zoomPanel { position: fixed; z-index: 24; background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 24px 60px -14px rgba(0,0,0,0.25); padding: 14px 16px; display: none; flex-direction: column; gap: 10px;
    opacity: 0; transform: scale(0.96); transition: opacity 150ms ease, transform 200ms cubic-bezier(.2,.8,.2,1); }
  #zoomPanel.show { opacity: 1; transform: scale(1); }
  #zoomPanel .zoom-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: move; user-select: none; }
  #zoomPanel .zoom-head #zoomTitle { color: var(--ink); font-weight: 600; }
  #zoomPanel .zoom-head .zoom-hint { font-size: 10.5px; }
  #zoomPanel .zoom-head button { border: none; background: none; color: var(--muted); font-size: 14px; padding: 0 4px; margin-left: auto; }
  #zoomPanel .zoom-head button:hover { color: var(--ink); }
  #zoomText { font-size: 14px; line-height: 1.6; }
  #zoomText b { background: var(--proposal-bg); border-radius: 3px; padding: 0 1px; }
  #zoomText s { color: var(--cut); text-decoration-color: var(--cut); }
  #zoomStatus { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #zoomStatus .key { display: inline-flex; align-items: center; gap: 5px; }
  #zoomStatus .sw { width: 18px; height: 10px; border-radius: 2px; display: inline-block; }
  #zoomStatus .sw.cut { background: repeating-linear-gradient(-45deg, #bdbdbd 0 1.5px, #f2f2f2 1.5px 5px); border: 1px solid var(--gauge-fill); }
  #zoomStatus .sw.sel { background: rgba(0,112,243,0.14); border: 1.5px solid var(--accent); }
  #zoomStatus b { color: var(--ink); font-weight: 600; }
  .zoom-btns button:disabled { opacity: 0.35; cursor: default; filter: none; }
  #zoomCanvas { width: 100%; height: 110px; display: block; border-radius: 8px; background: var(--surface-2); cursor: ew-resize; }
  .zoom-handles { display: flex; flex-direction: column; gap: 6px; }
  .zoom-handle-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .zoom-handle-row label { width: 26px; color: var(--muted); }
  .zoom-handle-row input[type=number] { width: 82px; font: inherit; font-size: 12px; padding: 3px 5px;
    border: 1px solid var(--line); border-radius: 6px; font-variant-numeric: tabular-nums; background: var(--panel); color: var(--ink); }
  .zoom-handle-row input[type=number].active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

<script>
let S = null;
let toks = [];        // {type:'w', wi, s, e} | {type:'g', gid, g, s, e}
let gv = new Map();   // gap id -> {usable, rec, keep, user}
let sel = null;       // {a, b} token index range
let selReviewMatch = null;  // {kind:'ng'|'block', ref} when `sel` exactly covers a pending review item
let selAllCut = false;      // whether the current selection is currently all cut (Enter/popToggle flips it)
let cursorTime = 0;   // last clicked position - where Space/재생 starts playing from
let gdrag = null;     // gauge drag state
const $ = (s) => document.querySelector(s);
const video = $('#video');
const PX_PER_SEC = 44, G_MIN = 12, G_MAX = 260;

// ------------------------------------------------------------------ data
async function load() {
  S = await (await fetch('/api/session')).json();
  document.title = `${S.name} · video-cut`;
  $('#title').textContent = S.name;
  video.src = '/media';
  setGapView(S.pause.view);
  buildTokens();
  renderTranscript();
  renderPauseRow();
  renderReviewPanel();
  renderSuggestions();
  updateStats();
  buildWordIndex();
  updatePlayInfo();
  renderReviewEstimate();
  maybeShowFirstRunHelp();
}
// R1: 검토 화면 첫 진입 시 "검토 N건, 예상 M분" - 막막함을 없애는 게 목적이라 페이지 로드 시
// 한 번만 보여준다(개별 결정마다 다시 계산하지 않음 - 카드 20초 가정은 어차피 근사치다).
function renderReviewEstimate() {
  const est = S.review_estimate;
  $('#reviewEstimate').textContent = est && est.pending
    ? `예상 ${Math.max(1, Math.round(est.estimated_sec / 60))}분` : '';
}
// The keyboard shortcuts (J/⌘Z/X/Z...) this tool leans on are otherwise only discoverable by
// noticing the small "?" button in the corner - show the help popup once per browser so a
// first-time session isn't purely trial-and-error. localStorage is per-browser-profile, not
// per-video, so this fires once ever on a given machine, not once per session.
function maybeShowFirstRunHelp() {
  try {
    if (localStorage.getItem('video-cut-help-shown')) return;
    localStorage.setItem('video-cut-help-shown', '1');
  } catch (e) { return; }  // private browsing / storage blocked: skip rather than show every load
  $('#helpPop').classList.add('show');
}
function setGapView(list) { gv = new Map(list.map((v) => [v.id, v])); }
function logAction(action, detail = {}) {
  fetch('/api/log', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...detail }) }).catch(() => {});
}
async function decide(msg) {
  const r = await (await fetch('/api/decision', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(msg) })).json();
  if (!r.ok) { toast('실패: ' + r.error); return; }
  S.cut_spans = r.cut_spans; S.word_states = r.word_states; S.decisions = r.decisions;
  S.can_undo = r.can_undo; S.can_redo = r.can_redo;
  S.suggestions = r.suggestions;
  setGapView(r.gap_view);
  applyStates(); updateStats(); renderReviewPanel(); renderSuggestions();
  return r;
}

// ------------------------------------------------------------------ pattern suggestions (12장 #2)
// A blue advisory banner, not a decision popup: the LLM only proposes a rule + which
// still-undecided same-case items fit it (server.py's check_pattern/apply_suggestion) - the
// user always clicks accept or dismiss here, nothing is ever auto-applied silently.
function renderSuggestions() {
  const panel = $('#suggestionPanel'); panel.innerHTML = '';
  for (const sg of (S.suggestions || [])) {
    const card = document.createElement('div'); card.className = 'suggestion-card';
    card.innerHTML = `<div class="sg-head">패턴 발견</div>
      <div class="sg-text">${esc(sg.rule_text)}</div>
      <div class="sg-n">해당하는 나머지 ${sg.candidate_ids.length}건에 적용할까요?</div>
      <div class="sg-btns">
        <button class="ok" data-a="1">예, 적용</button>
        <button data-a="0">아니오, 계속 물어봐줘</button>
      </div>`;
    card.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => applySuggestion(sg.id, b.dataset.a === '1')));
    panel.appendChild(card);
  }
}
async function applySuggestion(id, accept) {
  const r = await (await fetch('/api/suggestion', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, accept }) })).json();
  if (!r.ok) { toast('실패: ' + r.error); return; }
  S.cut_spans = r.cut_spans; S.word_states = r.word_states; S.decisions = r.decisions; S.suggestions = r.suggestions;
  S.can_undo = r.can_undo; S.can_redo = r.can_redo;
  applyStates(); updateStats(); renderReviewPanel(); renderSuggestions();
  toast(accept ? '패턴 적용됨' : '무시함');
}

// ------------------------------------------------------------------ transcript search (12장 #4)
// Literal substring match is instant and free (client-side only). Only when that finds
// nothing does it fall back to a server-side semantic search (transcript_search.py) for
// queries that describe content rather than quote it ("화자 이탈만", "숫자 나오는 데").
let searchQuery = '';
let searchMatches = [];  // [{wiStart, wiEnd}] (wiEnd exclusive)
let searchIdx = -1;

function clearSearchHits() {
  document.querySelectorAll('.tok.w.search-hit').forEach((el) => el.classList.remove('search-hit', 'search-cur'));
}
function paintSearchHits() {
  clearSearchHits();
  for (const m of searchMatches) {
    for (let wi = m.wiStart; wi < m.wiEnd; wi++) {
      document.querySelector(`.tok.w[data-wi="${wi}"]`)?.classList.add('search-hit');
    }
  }
  markCurrentSearchMatch();
}
function markCurrentSearchMatch() {
  document.querySelectorAll('.tok.w.search-cur').forEach((el) => el.classList.remove('search-cur'));
  const m = searchMatches[searchIdx];
  if (!m) return;
  let first = null;
  for (let wi = m.wiStart; wi < m.wiEnd; wi++) {
    const el = document.querySelector(`.tok.w[data-wi="${wi}"]`);
    if (el) { el.classList.add('search-cur'); first = first || el; }
  }
  first?.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
// Literal match ignores spacing and runs across word boundaries, so "자존감은 크게" or "자존 감"
// is found instantly instead of falling through to the slow AI search.
let searchHay = null;
function literalMatches(query) {
  const needle = query.replace(/\s+/g, '').toLowerCase();
  if (!needle) return [];
  if (!searchHay) {
    let text = ''; const owner = [];
    for (const w of S.words) { const t = w.t.replace(/\s+/g, '').toLowerCase(); text += t; for (let i = 0; i < t.length; i++) owner.push(w.wi); }
    searchHay = { text, owner };
  }
  const { text, owner } = searchHay; const out = [];
  for (let i = text.indexOf(needle); i >= 0; i = text.indexOf(needle, i + needle.length)) {
    out.push({ wiStart: owner[i], wiEnd: owner[i + needle.length - 1] + 1 });
  }
  return out;
}
async function runSearch(query) {
  searchQuery = query;
  if (!query) { searchMatches = []; searchIdx = -1; clearSearchHits(); $('#searchStatus').textContent = ''; return; }
  const literal = literalMatches(query);
  if (literal.length) {
    searchMatches = literal; searchIdx = 0;
    $('#searchStatus').textContent = `${searchMatches.length}건 · Enter로 다음`;
    paintSearchHits();
    return;
  }
  searchMatches = []; searchIdx = -1; clearSearchHits();  // don't leave the previous query's hits painted while waiting
  $('#searchStatus').textContent = '의미로 찾는 중… (몇 초 걸림)';
  try {
    const r = await (await fetch('/api/search', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query }) })).json();
    if (searchQuery !== query) return;  // a newer query superseded this one while we waited
    if (!r.ok) { $('#searchStatus').textContent = '검색 실패'; return; }
    searchMatches = r.matches.map((m) => ({ wiStart: m.wi_start, wiEnd: m.wi_end }));
    searchIdx = searchMatches.length ? 0 : -1;
    $('#searchStatus').textContent = searchMatches.length ? `AI 검색 ${searchMatches.length}건 · Enter로 다음` : '결과 없음';
    paintSearchHits();
  } catch (e) {
    $('#searchStatus').textContent = '검색 실패';
  }
}
function nextSearchMatch() {
  if (!searchMatches.length) return;
  searchIdx = (searchIdx + 1) % searchMatches.length;
  $('#searchStatus').textContent = `${searchIdx + 1}/${searchMatches.length}`;
  markCurrentSearchMatch();
}
$('#searchBox').addEventListener('keydown', (e) => {
  e.stopPropagation();  // keep the global J/Space/⌘Z shortcuts from firing while typing here
  if (e.key === 'Enter') {
    e.preventDefault();
    const q = e.target.value.trim();
    if (q && q === searchQuery && searchMatches.length) nextSearchMatch();
    else runSearch(q);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    e.target.value = ''; searchQuery = ''; searchMatches = []; searchIdx = -1;
    clearSearchHits(); $('#searchStatus').textContent = '';
    e.target.blur();
  }
});

// ------------------------------------------------------------------ tokens / transcript
function buildTokens() {
  toks = [];
  const gapAfter = new Map(S.pause.gaps.map((g) => [g.prev_wi, g]));
  S.words.forEach((w) => {
    toks.push({ type: 'w', wi: w.wi, s: w.s, e: w.e });
    const g = gapAfter.get(w.wi);
    if (g) toks.push({ type: 'g', gid: g.id, g, s: g.gap_start, e: g.gap_end });
  });
}
function gaugeWidth(dur) { return Math.max(G_MIN, Math.min(G_MAX, Math.round(dur * PX_PER_SEC))); }

// IMPORTANT: every token owns its own trailing space (inside the span, not a sibling text
// node). A free-floating text node between spans is where native drag-selection used to
// end up - its parentElement is the <p>, not a .tok, so closestTok() returned null and the
// whole selection silently vanished. Keeping the space inside the token fixes that at the
// source instead of working around it in the selection code.
function renderTranscript() {
  const root = $('#transcript'); root.innerHTML = '';
  const spacer = document.createElement('div'); spacer.id = 'topSpacer'; root.appendChild(spacer);
  let para = document.createElement('p'); para.className = 'para';
  toks.forEach((t, ti) => {
    if (t.type === 'w') {
      const w = S.words[t.wi];
      if (t.wi > 0) {
        const prev = S.words[t.wi - 1]; const gap = w.s - prev.e;
        if (gap >= 1.2 || (gap >= 0.5 && /[.?!]$/.test(prev.t))) { root.appendChild(para); para = document.createElement('p'); para.className = 'para'; }
      }
      const el = document.createElement('span');
      el.className = 'tok w'; el.dataset.t = ti; el.dataset.wi = w.wi; el.textContent = w.t + ' '; el.title = fmt(w.s);
      para.appendChild(el);
    } else {
      const el = document.createElement('span');
      el.className = 'tok g'; el.dataset.t = ti; el.dataset.gid = t.gid;
      el.style.width = `${gaugeWidth(t.g.duration)}px`;
      el.innerHTML = '<span class="fill"></span><span class="lbl"></span>';
      el.addEventListener('mousedown', onGaugeDown);
      el.addEventListener('dblclick', (ev) => { ev.preventDefault(); decide({ type: 'pause_gap', gap_id: t.gid, keep_sec: null }); toast('추천값으로'); });
      el.addEventListener('mousemove', (ev) => showGtip(t, ev));
      el.addEventListener('mouseleave', hideGtip);
      para.appendChild(el);
    }
  });
  root.appendChild(para);
  applyStates();
  root.addEventListener('mouseup', onMouseUp);
  sizeTopSpacer();
}
function findTokIndex(wi) { return toks.findIndex((t) => t.type === 'w' && t.wi === wi); }

// The video panel is fixed to the viewport's top-right corner, not to #transcript's own box,
// so how much (if any) of the first lines it actually covers depends on window width - not
// knowable from CSS alone. Measure the real overlap and reserve exactly that with a floated
// spacer, so every line below the video's bottom edge gets the full column width back.
function sizeTopSpacer() {
  const spacer = $('#topSpacer'); const vw = $('#videoWrap'); const tr = $('#transcript');
  if (!spacer || !vw || getComputedStyle(vw).display === 'none') { if (spacer) spacer.style.cssText = 'float:right;width:0;height:0'; return; }
  const vr = vw.getBoundingClientRect(); const trr = tr.getBoundingClientRect();
  const overlap = Math.max(0, Math.min(trr.width, trr.right - vr.left + 24));
  spacer.style.cssText = `float:right;width:${overlap}px;height:${vr.height + 24}px`;
  scheduleScrollProgress();
}
window.addEventListener('resize', () => { clearTimeout(window.__rsz); window.__rsz = setTimeout(() => { sizeTopSpacer(); renderScrollTicks(); }, 120); });

// ------------------------------------------------------------------ scroll progress (script reading position)
// #main is the only element that scrolls (the page itself never does), so its own
// scrollTop/scrollHeight IS "how far into the script" - no viewport/IntersectionObserver math
// needed. rAF-throttled: scroll fires far faster than the bar needs to repaint.
let scrollProgressRaf = null;
let scrollProgressPending = 0;  // set by renderScrollTicks() - read here for aria-valuetext
function updateScrollProgress() {
  scrollProgressRaf = null;
  const main = $('#main'); const bar = $('#scrollProgress'); const fill = $('#scrollProgressFill');
  if (!main || !bar || !fill) return;
  const max = main.scrollHeight - main.clientHeight;
  // Nothing to scroll (short transcript) reads as fully caught-up, not 0% - there's no more
  // of the script below the fold to account for.
  const pct = max > 0 ? Math.min(1, Math.max(0, main.scrollTop / max)) : 1;
  const pctInt = Math.round(pct * 100);
  fill.style.width = `${(pct * 100).toFixed(2)}%`;
  bar.setAttribute('aria-valuenow', String(pctInt));
  // aria-valuenow alone reads as a bare number to a screen reader ("34") - valuetext lets it
  // say what that number and the pending count actually mean.
  bar.setAttribute('aria-valuetext', scrollProgressPending
    ? `${pctInt}퍼센트 읽음 · 검토 대기 ${scrollProgressPending}건`
    : `${pctInt}퍼센트 읽음`);
}
function scheduleScrollProgress() { if (scrollProgressRaf == null) scrollProgressRaf = requestAnimationFrame(updateScrollProgress); }
$('#main').addEventListener('scroll', scheduleScrollProgress, { passive: true });

// Ticks: one per still-open item in the 검토 필요 queue, positioned at that item's actual
// depth in the script - "how far" alone doesn't say whether the rest is smooth sailing or
// five more decisions are waiting just past the fold. Recomputed whenever the queue's
// membership/status changes (renderReviewPanel, called after every decide()) or the layout
// reflows (resize) - decisions themselves don't move word positions, so no extra hook needed.
// Each tick carries the same type/status label the sidebar card shows (title, hover-only -
// consistent with every other inline hint in this app, e.g. the ⓘ note icons) and clicking it
// jumps straight to that span, same as clicking its sidebar card would.
function renderScrollTicks() {
  const main = $('#main'); const layer = $('#scrollProgressTicks');
  if (!main || !layer) return;
  const max = main.scrollHeight - main.clientHeight;
  layer.innerHTML = '';
  const items = [
    ...reviewNgItems().map((n) => ({
      wiStart: n.wi_start, wiEnd: n.wi_end - 1, status: ngStatus(n), label: ngTypeLabel(n),
    })),
    ...reviewBlocks().map((b) => ({
      wiStart: b.wi_start, wiEnd: b.wi_end, status: blockStatus(b), label: '발화 블록',
    })),
  ];
  scrollProgressPending = items.filter((it) => it.status === 'pending').length;
  scheduleScrollProgress();  // pending count just changed - refresh the valuetext even mid-scroll
  if (max <= 0) return;
  const mainTop = main.getBoundingClientRect().top;
  for (const it of items) {
    const el = document.querySelector(`.tok.w[data-wi="${it.wiStart}"]`);
    if (!el) continue;
    const top = el.getBoundingClientRect().top - mainTop + main.scrollTop;
    const pct = Math.min(1, Math.max(0, top / max)) * 100;
    const tick = document.createElement('div');
    tick.className = 'tick' + (it.status !== 'pending' ? ' done' : '');
    tick.style.left = `${pct}%`;
    tick.title = `${it.label} · ${STATUS_KO[it.status]}`;
    // Same two-step as J's nextPending(): scroll first, select once the smooth-scroll has
    // roughly landed - selecting immediately fights the still-animating scroll position.
    tick.addEventListener('mousedown', (ev) => {
      ev.stopPropagation();
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      setTimeout(() => selectWordRange(it.wiStart, it.wiEnd), 250);
    });
    layer.appendChild(tick);
  }
}

// Click/drag-to-seek: the same gesture the video's own scrubber already trains you on, so the
// script's progress bar isn't purely decorative.
function scrollBarSeek(clientX) {
  const main = $('#main'); const rect = $('#scrollProgress').getBoundingClientRect();
  const max = main.scrollHeight - main.clientHeight;
  if (max <= 0) return;
  const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  main.scrollTop = ratio * max;
}
let barDragging = false;
function onBarDragMove(ev) { if (barDragging) scrollBarSeek(ev.clientX); }
function onBarDragUp() { barDragging = false; window.removeEventListener('mousemove', onBarDragMove); }
$('#scrollProgress').addEventListener('mousedown', (ev) => {
  if (ev.button !== 0) return;
  ev.preventDefault();
  barDragging = true;
  scrollBarSeek(ev.clientX);
  window.addEventListener('mousemove', onBarDragMove);
  window.addEventListener('mouseup', onBarDragUp, { once: true });
});
$('#scrollProgress').addEventListener('keydown', (ev) => {
  const main = $('#main');
  if (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') { ev.preventDefault(); main.scrollTop += 80; }
  else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') { ev.preventDefault(); main.scrollTop -= 80; }
  else if (ev.key === 'Home') { ev.preventDefault(); main.scrollTop = 0; }
  else if (ev.key === 'End') { ev.preventDefault(); main.scrollTop = main.scrollHeight; }
});

// ------------------------------------------------------------------ live playhead highlight
// Words are in ascending time order, so a binary search finds the word under the playhead in
// O(log n); runs off the video's own 'timeupdate' so it tracks BOTH virtual (skip-cuts)
// playback and the native scrubber/controls, not just our own playRange() calls.
let wordIdx = [];   // [{s, e, wi}] sorted by s
let curPlayEl = null;
function buildWordIndex() { wordIdx = toks.filter((t) => t.type === 'w').map((t) => ({ s: t.s, e: t.e, wi: t.wi })); }
function highlightAt(t) {
  let lo = 0, hi = wordIdx.length - 1, idx = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1; const w = wordIdx[mid];
    if (t < w.s) hi = mid - 1; else if (t > w.e) lo = mid + 1; else { idx = mid; break; }
  }
  const el = idx >= 0 ? document.querySelector(`.tok.w[data-wi="${wordIdx[idx].wi}"]`) : null;
  if (el === curPlayEl) return;
  if (curPlayEl) curPlayEl.classList.remove('playing');
  curPlayEl = el;
  if (el) {
    el.classList.add('playing');
    const r = el.getBoundingClientRect(); const mr = $('#main').getBoundingClientRect();
    if (r.top < mr.top + 90 || r.bottom > mr.bottom - 40) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}
video.addEventListener('timeupdate', () => highlightAt(video.currentTime));
video.addEventListener('pause', () => { if (video.currentTime >= (S?.duration ?? 0) - 0.05) { if (curPlayEl) curPlayEl.classList.remove('playing'); curPlayEl = null; } });

function wordClass(wi) {  // exactly two visual states: '' (kept) or ' cut' - a word not yet
  // decided one way or the other ('review' / 'proposed:block') reads as kept-for-now and
  // shows up instead in the sidebar's 검토 필요 list, never as a third in-text style
  const st = S.word_states[wi];
  return (st === 'keep' || st === 'review' || st === 'proposed:block') ? '' : ' cut';
}
function gapCut(g) {  // the pause lies inside a cut that isn't its own trim
  return S.cut_spans.some((sp) => sp.kind !== 'pause' && sp.start <= g.gap_start + 0.03 && sp.end >= g.gap_end - 0.03);
}
// Words only PART of which is cut - a 정밀 삭제 inside a word, or a 정밀 복원 carved out of a
// cut word. Word-level state can't say that, so without this such a word looked untouched
// (or fully cut) and the precise edit was impossible to find again (UX audit H1).
let partSet = new Map();
// -> Map wi -> {mode: 'cut'|'keep', segs: [[f0, f1], ...]} (fractions of the word's duration)
function partialWords() {
  const out = new Map(); const spans = S.cut_spans; let k = 0;
  for (const w of S.words) {
    while (k < spans.length && spans[k].end <= w.s) k++;
    const dur = w.e - w.s; if (dur <= 0) continue;
    const cov = [];
    for (let j = k; j < spans.length && spans[j].start < w.e; j++) {
      const a = Math.max(w.s, spans[j].start), b = Math.min(w.e, spans[j].end);
      if (b > a) cov.push([a, b]);
    }
    const frac = ([a, b]) => [(a - w.s) / dur, (b - w.s) / dur];
    if (wordClass(w.wi) === '') {  // shown kept: mark the parts that are actually cut
      if (cov.reduce((t, [a, b]) => t + b - a, 0) > 0.03) out.set(w.wi, { mode: 'cut', segs: cov.map(frac) });
    } else {  // shown cut: mark the parts that were restored. Cut spans stop pad_sec short of
      // each word edge, so only look for gaps inside [s + pad, e - pad]
      const lo = w.s + S.pad_sec, hi = w.e - S.pad_sec, gaps = []; let x = lo;
      for (const [a, b] of cov) { if (a > x + 0.001) gaps.push([x, Math.min(a, hi)]); x = Math.max(x, b); }
      if (x < hi - 0.001) gaps.push([x, hi]);
      if (gaps.reduce((t, [a, b]) => t + Math.max(0, b - a), 0) > 0.03) out.set(w.wi, { mode: 'keep', segs: gaps.map(frac) });
    }

}
function paintPartial(el, p) {
  if (!p) { el.style.backgroundImage = el.style.backgroundSize = el.style.backgroundPosition = ''; return; }
  const color = p.mode === 'cut' ? 'var(--danger)' : 'var(--accent)';
  const y = p.mode === 'cut' ? '58%' : '100%', h = p.mode === 'cut' ? '2px' : '2.5px';
  // background-position %: an image of width fraction f placed at p% has its left edge at p*(1-f)
  el.style.backgroundImage = p.segs.map(() => `linear-gradient(${color}, ${color})`).join(',');
  el.style.backgroundSize = p.segs.map(([a, b]) => `${Math.max(2, (b - a) * 100)}% ${h}`).join(',');
  el.style.backgroundPosition = p.segs.map(([a, b]) => { const f = b - a; return `${f >= 0.999 ? 0 : (a / (1 - f)) * 100}% ${y}`; }).join(',');
}
function applyStates() {
  partSet = partialWords();
  document.querySelectorAll('.tok').forEach((el) => {
    const t = toks[+el.dataset.t];
    const wasSel = el.classList.contains('sel');
    const wasHit = el.classList.contains('search-hit');
    const wasCur = el.classList.contains('search-cur');
    if (t.type === 'w') {
      const part = partSet.has(t.wi);
      el.className = 'tok w' + wordClass(t.wi) + (part ? ' partcut' : '');
      paintPartial(el, partSet.get(t.wi));
      el.title = fmt(t.s) + (part ? (partSet.get(t.wi).mode === 'cut' ? ' · 일부 정밀 삭제됨(빨간 줄)' : ' · 일부 정밀 복원됨(파란 밑줄)') + ' — 선택 후 Z로 확인' : '');
    } else {
      const v = gv.get(t.gid); const cut = gapCut(t.g);
      const ruleKeep = !['NORMAL', 'ENUMERATION', 'QUOTE_TO_EXPLANATION'].includes(t.g.style);
      el.className = 'tok g' + (cut ? ' cut' : v.user ? ' user' : ruleKeep ? ' rule' : '');
      const ratio = v.usable > 0 ? Math.min(1, v.keep / v.usable) : 1;
      el.querySelector('.fill').style.width = `${Math.round(ratio * 100)}%`;
      const w = gaugeWidth(t.g.duration);
      el.querySelector('.lbl').textContent = w >= 46 ? (cut ? '' : `${v.keep.toFixed(2)}`) : '';
    }
    if (wasSel) el.classList.add('sel');
    if (wasHit) el.classList.add('search-hit');
    if (wasCur) el.classList.add('search-cur');
  });
}

// ------------------------------------------------------------------ gauge drag
function onGaugeDown(ev) {
  if (ev.button !== 0) return;
  const el = ev.currentTarget; const t = toks[+el.dataset.t];
  if (gapCut(t.g)) return;  // inside a cut - restore the cut first (select it, see onMouseUp)
  ev.preventDefault();
  clearSel();
  gdrag = { el, t, rect: el.getBoundingClientRect(), moved: false };
  el.classList.add('dragging');
  gaugeAt(ev.clientX);
  window.addEventListener('mousemove', onGaugeMove);
  window.addEventListener('mouseup', onGaugeUp, { once: true });
}
function gaugeAt(x) {
  const { el, t, rect } = gdrag; const v = gv.get(t.gid);
  const ratio = Math.min(1, Math.max(0, (x - rect.left) / rect.width));
  let keep = Math.round(ratio * v.usable * 20) / 20;  // 0.05s steps
  if (ratio <= 0.04) keep = 0;
  if (keep >= v.usable - 0.03) keep = v.usable;
  gdrag.keep = keep;
  el.querySelector('.fill').style.width = `${Math.round((v.usable ? keep / v.usable : 1) * 100)}%`;
  el.querySelector('.lbl').textContent = rect.width >= 46 ? keep.toFixed(2) : '';
  showGtip(t, { clientX: x, clientY: rect.top }, keep);
}
function onGaugeMove(ev) { if (!gdrag) return; gdrag.moved = true; gaugeAt(ev.clientX); }
async function onGaugeUp() {
  window.removeEventListener('mousemove', onGaugeMove);
  if (!gdrag) return;
  const { el, t, keep } = gdrag; el.classList.remove('dragging'); gdrag = null; hideGtip();
  const v = gv.get(t.gid);
  const same = Math.abs(keep - v.rec) < 0.01;
  await decide({ type: 'pause_gap', gap_id: t.gid, keep_sec: same ? null : keep });
}
function showGtip(t, ev, liveKeep) {
  const v = gv.get(t.gid); const tip = $('#gtip');
  const keep = liveKeep ?? v.keep;
  const cut = gapCut(t.g);
  tip.innerHTML = cut ? `쉼 ${t.g.duration.toFixed(2)}s · 잘린 범위 안 (클릭해서 살리기)`
    : `쉼 ${t.g.duration.toFixed(2)}s → <b>${keep.toFixed(2)}s 남김</b>${keep < 0.001 ? ' (삭제)' : ''} · 추천 ${v.rec.toFixed(2)}s (${styleKo(t.g.style)})${v.user && liveKeep == null ? ' · 직접 조정함, 더블클릭 = 추천값' : ''}`;
  tip.style.display = 'block';
  tip.style.left = `${Math.min(ev.clientX + 12, window.innerWidth - tip.offsetWidth - 10)}px`;
  tip.style.top = `${ev.clientY - 34}px`;
}
function hideGtip() { $('#gtip').style.display = 'none'; }

// ------------------------------------------------------------------ selection
function onMouseUp(ev) {
  if (gdrag) return;
  setTimeout(() => {
    const s = window.getSelection();
    if (s && !s.isCollapsed) {
      const a = closestTok(s.anchorNode), b = closestTok(s.focusNode);
      s.removeAllRanges();
      if (a && b) { let x = +a.dataset.t, y = +b.dataset.t; if (x > y) [x, y] = [y, x]; return select(x, y); }
    }
    const el = ev.target?.closest?.('.tok');
    if (!el) { clearSel(); return; }
    const ti = +el.dataset.t; const t = toks[ti];
    if (t.type === 'g') { if (gapCut(t.g)) return select(ti, ti); return; }  // a cut pause: select just it to restore
    return select(ti, ti);   // clicking a word is always a decide+cursor action, never playback - see 재생/정지 controls under the video
  }, 0);
}
// Walk up from wherever the browser's native selection landed until a .tok is found. Works
// for text nodes inside a token AND (defensively) for any stray node between tokens.
function closestTok(node) {
  while (node && node !== document.body) {
    if (node.nodeType === 1 && node.classList?.contains('tok')) return node;
    node = node.parentNode;
  }
  return null;
}

function select(x, y) {
  clearSel(false);
  sel = { a: x, b: y };
  logAction('select', { a: x, b: y });
  for (let i = x; i <= y; i++) document.querySelector(`.tok[data-t="${i}"]`)?.classList.add('sel');
  const range = selRange();
  cursorTime = range.start;  // Space/재생 plays from here, not wherever the video happens to be
  updatePlayInfo();
  const words = toks.slice(x, y + 1).filter((t) => t.type === 'w');
  const states = words.map((t) => S.word_states[t.wi]);
  let allCut = words.length > 0 ? states.every((st) => st.startsWith('cut'))
    : toks.slice(x, y + 1).every((t) => gapCut(t.g));
  const item = words.length ? S.ng.find((n) => n.wi_start <= words[0].wi && words[words.length - 1].wi < n.wi_end) : null;
  const nGaps = toks.slice(x, y + 1).filter((t) => t.type === 'g').length;
  const nPart = words.filter((t) => partSet.has(t.wi)).length;
  $('#popHint').textContent = `${words.length}단어${nGaps ? ` · 쉼 ${nGaps}개` : ''} · ${fmt(range.start)}–${fmt(range.end)} · ${(range.end - range.start).toFixed(1)}초`
    + (nPart ? ` · 일부 정밀 편집됨 — Z로 확인` : '');
  // A selection that exactly matches a 검토 필요 item's words (word-for-word, or a whole
  // block) resolves THAT item's own decision (feeds personalization, updates its status in
  // the sidebar) instead of a generic manual override - see applySel(). 건너뛰기/검토 완료/★
  // live on the sidebar card itself (renderReviewPanel) since they're decisions, not edits -
  // this popup only holds tools that touch content (듣기/이음새/정밀 조정) plus the generic
  // 삭제/살리기 toggle, which doubles as the fast path for a matched review item too. ★ stays
  // in the popup too, but only for an AUTO_SAFE ng item (route !== 'REVIEW') - those never get
  // a sidebar card, so the popup is their only way to reach it.
  selReviewMatch = matchedReview(words);
  const why = item ? `${esc(item.clf?.reasoning || '')} <span style="color:var(--muted)">(신뢰도 ${item.clf?.confidence ?? '-'})</span>` : '';
  $('#popWhy').innerHTML = why; $('#popWhy').style.display = why ? 'block' : 'none';
  let reviewStatus = null;
  if (selReviewMatch) {
    const m = selReviewMatch;
    reviewStatus = m.kind === 'ng' ? ngStatus(m.ref) : blockStatus(m.ref);
    $('#popType').textContent = m.kind === 'ng' ? ngTypeLabel(m.ref) : '발화 블록';
    // a block's own FINAL/content lines are never cut, so "every word cut" is never true for a
    // whole-block selection - what the toggle flips there is whether the proposal is applied
    if (m.kind === 'block') allCut = !!S.decisions.blocks[String(m.ref.id)]?.approved;
    $('#popStatus').textContent = STATUS_KO[reviewStatus];
    $('#popMeta').style.display = 'flex';
  } else {
    $('#popMeta').style.display = 'none';
  }

  // of what's currently selected), so 삭제/살리기 never need two different shortcuts again.
  selAllCut = allCut;
  const toggleBtn = $('#popToggle');
  toggleBtn.innerHTML = `${allCut ? '살리기' : '삭제'} <kbd>↵</kbd>`;
  toggleBtn.className = allCut ? 'ok' : 'danger';
  const starHere = item && item.route !== 'REVIEW';  // REVIEW items star from their own card
  $('#popStar').style.display = starHere ? '' : 'none';
  if (starHere) $('#popStar').textContent = S.decisions.outtakes.includes(`ng:${item.i}`) ? '★ 엔딩용 후보' : '☆ 엔딩용 후보';
  $('#popStar').dataset.ref = starHere ? `ng:${item.i}` : '';
  // 백로그/R3-신뢰-장치.md 오삭제 신고: 지금 선택이 정확히 NG 항목 하나와 겹치고 현재 잘린
  // 상태일 때만 의미가 있다 - 신고는 ng 인덱스 단위 결정이라 일반 수동 선택에는 못 붙인다.
  const reportHere = item && allCut;
  $('#popReport').style.display = reportHere ? '' : 'none';
  $('#popReport').dataset.i = reportHere ? item.i : '';
  const pop = $('#pop'); pop.style.display = 'flex';

// ------------------------------------------------------------------ pending navigation

  for (const b of reviewBlocks()) if (blockStatus(b) === 'pending') out.push([b.wi_start, b.wi_end]);
  return out.map(([wa, wb]) => ({ a: findTokIndex(wa), b: findTokIndex(wb), start: S.words[wa].s }))

}

  // consecutive checks and never once satisfy "t < sp.end". That's the "sometimes fails"
  // precise-delete bug (a real fragment plays, briefly, then the check misses the whole
  // span). Fixed by also comparing against the PREVIOUS frame's time: if the span's start
  // fell inside [lastT, t) - even if t has already sailed past its end - we still force the
  // jump, so the leak is at most one frame instead of the entire remaining span.
  // Stall watchdog: the local server occasionally can't keep up with the rapid seeks a
  // cut-heavy stretch needs (many short cuts back to back), and the browser is then left
  // sitting at the jump target forever - readyState stuck at HAVE_METADATA, networkState
  // idle, video.paused still false, just no data ever arrives. Nothing in the normal event
  // model (no 'pause', no 'stalled' guaranteed) reliably reports this, so it's watched for
  // directly: if currentTime hasn't moved in STALL_MS while we believe we're playing, nudge
  // the element (a fresh play() + a hair-forward seek) to force it to re-request data. This is
  // the actual guarantee behind "playback never stops unless I stop it" - it keeps retrying

    // first - that's exactly what left playback stuck forever at one frozen timestamp

// 사용자가 도중에 정지/다른 재생을 하면(stop()이 reel을 null로 비움) 릴은 그 자리에서 멈추고

// Dedicated transport under the video instead of the native player's own controls, which sit

// ------------------------------------------------------------------ review panel (검토 필요)
// The queue of every case the algorithm itself routed to REVIEW (NG items) plus every
// speaker-block retake - shown in full, decided or not, as an audit trail rather than a
// todo list that empties into silence. None of these get their own in-text highlight - they
// render as kept-for-now (see wordClass) and live here instead. Whichever way an item is
// resolved is also this user's ground truth: the server folds it into
// ~/.video-cut/prefs/<user>.json (keyed by the LLM's case tag, e.g. A/B/E self-repair

const CASE_KO = { A: '정정 재시작', B: '재진술', C: '강조 반복', D: '정상 나열', E: '조사·어미 수정', F: '미완성 전환', OTHER: '기타', FILLER: '필러' };

    'ng', n, () => selectWordRange(n.wi_start, n.wi_end - 1));
}
function makeBlockCard(b) {
  return reviewCard('발화 블록', blockStatus(b),
    `${b.preview || `발화 블록 (${b.lines.length}줄)`} · ${fmtDur(b.proposed_delete_sec || 0)} 삭제 제안`, [b.wi_start, b.wi_end],
    'block', b, () => selectWordRange(b.wi_start, b.wi_end));
}
function renderReviewPanel() {
  const ngItems = reviewNgItems(), blocks = reviewBlocks();
  const total = ngItems.length + blocks.length;
  // Anything not 'pending' already reads as resolved-for-now everywhere else (STATUS_KO,
  // the grey st-skipped/st-done_* card treatment, the N/M 완료 count) - the drawer just gives
  // that same group a place to live instead of sitting inline among what's still open.
  const doneNg = ngItems.filter((n) => ngStatus(n) !== 'pending');
  const doneBlocks = blocks.filter((b) => blockStatus(b) !== 'pending');
  const activeNg = ngItems.filter((n) => ngStatus(n) === 'pending');
  const activeBlocks = blocks.filter((b) => blockStatus(b) === 'pending');
  const done = doneNg.length + doneBlocks.length;
  $('#reviewCount').textContent = total ? `· ${total}` : '';
  $('#reviewProgress').textContent = total ? `${done}/${total} 완료` : '';
  const panel = $('#reviewPanel'); panel.innerHTML = '';
  if (!total) { panel.innerHTML = '<div class="empty-hint">검토할 항목이 없습니다</div>'; renderScrollTicks(); return; }
  if (done) {
    const drawer = document.createElement('div'); drawer.id = 'reviewDoneDrawer';
    const head = document.createElement('button');
    head.id = 'reviewDoneHead'; head.setAttribute('aria-expanded', String(reviewDoneOpen));
    head.innerHTML = `<span>✓ 검토 완료<span class="n">${done}건</span></span><span class="chev">▸</span>`;
    head.addEventListener('click', () => { reviewDoneOpen = !reviewDoneOpen; renderReviewPanel(); });
    drawer.appendChild(head);
    const body = document.createElement('div');
    body.id = 'reviewDoneBody'; body.className = reviewDoneOpen ? 'open' : '';
    doneNg.forEach((n) => body.appendChild(makeReviewCard(n)));
    doneBlocks.forEach((b) => body.appendChild(makeBlockCard(b)));
    drawer.appendChild(body);
    panel.appendChild(drawer);
  }
  activeNg.forEach((n) => panel.appendChild(makeReviewCard(n)));
  activeBlocks.forEach((b) => panel.appendChild(makeBlockCard(b)));
  const personalized = doneNg.filter((n) => ngStatus(n) === 'auto').length;
  $('#reviewPersonalized').textContent = personalized ? `학습된 취향으로 ${personalized}건 자동 처리됨` : '';
  renderScrollTicks();
}

// ------------------------------------------------------------------ stats / confirm
function updateStats() {
  const removed = S.cut_spans.reduce((a, s) => a + (s.end - s.start), 0);
  const pz = S.cut_spans.filter((s) => s.kind === 'pause').reduce((a, s) => a + (s.end - s.start), 0);
  $('#durOrig').textContent = fmtDur(S.duration);
  $('#durEdited').textContent = fmtDur(S.duration - removed);
  const subEl = $('#pzHeadSub'); if (subEl) subEl.textContent = S.decisions.pause.enabled ? `${fmtDur(pz)} 정리` : '꺼짐';
  $('#btnUndo').disabled = !S.can_undo;
  $('#btnRedo').disabled = !S.can_redo;
}
// Promise-based yes/no dialog reusing the app's own modal chrome (drag handle, styling) -
// the browser's native confirm() looked out of place next to a fully custom UI and, worse,
// a user who once checks "이 페이지가 추가 대화상자를 표시하지 않도록 함" in their browser
// silently disables this safety warning on every future visit to this same localhost origin.
function confirmModal(message) {
  return new Promise((resolve) => {
    showModal(`<p>${esc(message)}</p>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button id="modalNo">취소</button>
        <button id="modalYes" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)">확정</button>
      </div>`);
    $('#modalNo').addEventListener('click', () => { hideModal(); resolve(false); });
    $('#modalYes').addEventListener('click', () => { hideModal(); resolve(true); });
  });
}
$('#btnConfirm').addEventListener('click', async () => {
  const remain = pendingList().length;
  if (remain) {
    const ok = await confirmModal(`아직 검토하지 않은 항목이 ${remain}곳 있습니다. 검토 항목은 처음부터 삭제된 상태라, 이대로 확정하면 ${remain}곳 모두 잘린 채로 나갑니다. 확정할까요?`);
    if (!ok) return;
  }
  showModal('<p>편집본을 만들고 컷 경계를 스스로 검토하는 중… (경계마다 재전사로 확인 - 영상 길이에 따라 1분 내외)</p>');
  const r = await (await fetch('/api/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })).json();
  if (!r.ok) { showModal(`<p>실패: ${esc(r.error)}</p><button onclick="hideModal()">닫기</button>`); return; }
  const poll = async () => {
    const st = (await (await fetch('/api/status')).json()).render;
    const line = st.state === 'rendering' ? `미리보기 렌더링 중… (${Math.round((Date.now() / 1000) - st.started)}s)`
      : st.state === 'done' ? `미리보기 완료 (${st.seconds}s): <code>${esc(st.path)}</code>`
      : st.state === 'error' ? `미리보기 실패: <code>${esc(st.detail)}</code>` : '';
    const warnings = r.boundary_warnings || [];
    // 컷편집이 확정 직전 스스로 검토한 결과: 각 컷 경계의 실제 이어붙인 오디오를 다시 전사해서
    // 기대 단어 수와 비교한 것(G2) - 예상보다 많이 들리면 잔여음, 적게 들리면 절단 의심. 확정은
    // 막지 않되(정상 발화 절대 보호 - 더 깎는 게 항상 안전한 건 아님) 정확한 위치를 짚어서 직접
    // 들어보게 한다 (2026-09-29).
    const warnBlock = warnings.length ? `
      <p style="color:var(--danger)"><strong>⚠ 자체 검토에서 ${warnings.length}곳이 의심됩니다. 들어보세요:</strong></p>
      <ul style="margin:4px 0 10px 18px">
        ${warnings.map((w) => `<li><a href="#" onclick="hideModal();video.currentTime=Math.max(0,${w.start}-1);video.play();return false">${fmtDur(w.start)} ~ ${fmtDur(w.end)}</a> <span style="color:var(--muted);font-size:12px">${esc(w.note || '')}</span></li>`).join('')}
      </ul>` : '';
    // 백로그/R1-결과-영수증.md 영수증 + R3의 "안전 배지"(신고된 오삭제 누적) - server.py의
    // Session.receipt()가 이번 확정과 history.jsonl의 직전 확정(r.previous, 이 영상 자신은
    // 제외) 양쪽을 계산해 함께 돌려준다.
    const rc = r.receipt, prev = r.previous;
    let receiptBlock = '';
    if (rc) {
      const totalCuts = rc.cuts_ng + rc.cuts_pause + rc.cuts_block + rc.cuts_manual;
      const reviewLine = rc.review_sec == null ? '정답지 대조로 확정 (실시간 검토 없음)'
        : prev && prev.review_sec != null && prev.review_sec > 0
          ? `${fmtDur(rc.review_sec)} (지난 영상 ${fmtDur(prev.review_sec)} ${rc.review_sec <= prev.review_sec ? '▼' : '▲'}${Math.abs(Math.round((1 - rc.review_sec / prev.review_sec) * 100))}%)`
          : fmtDur(rc.review_sec);
      receiptBlock = `
        <div style="margin:10px 0;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);font-size:13px;line-height:1.75">
          <div>이번 영상 &nbsp;${fmtDur(rc.raw_sec)} → ${fmtDur(rc.result_sec)} (잘라낸 ${fmtDur(rc.raw_sec - rc.result_sec)})</div>
          <div>자동 처리 &nbsp;컷 ${totalCuts}건 (NG ${rc.cuts_ng} · 쉼 ${rc.cuts_pause} · 대화블록 ${rc.cuts_block} · 수동 ${rc.cuts_manual})</div>
          <div>내 결정 &nbsp;복원 ${rc.restored} / 검토 ${rc.flagged}건</div>
          <div>검토 시간 &nbsp;${reviewLine}</div>
          <div>안전 &nbsp;신고된 오삭제 누적 <strong>${rc.reported_bad_cuts}건</strong></div>
        </div>`;
    }
    showModal(`<h2>확정 완료</h2>
      <p>편집 파일: <code>${esc(r.fcpxml)}</code></p>
      <p>클립 ${r.kept_segments}개 · 제거 ${fmtDur(r.removed_sec)} · 결과 ${fmtDur(r.result_sec)}</p>
      <p>${line}</p>
      ${receiptBlock}
      ${warnBlock}
      <p style="color:var(--muted);font-size:13px">Final Cut Pro에서: 라이브러리 열기 → 이 파일을 브라우저 패널로 드래그. 폴더 구조(edit/clean.mp4)를 유지하세요.</p>
      <button onclick="hideModal()">닫기</button>`);
    if (st.state === 'rendering') setTimeout(poll, 3000);
  };
  poll();
});
function showModal(html) {
  const modal = $('#modal');
  if (modal.style.display !== 'flex') $('#modalPanel').style.cssText = '';  // reopening fresh: forget any drag, re-center
  $('#modalBox').innerHTML = html;
  // Screen readers need a name for role="dialog" - reuse whatever heading/first line this
  // particular modal rendered instead of keeping a separate title in sync by hand (UX audit H-MODAL).
  const heading = $('#modalBox').querySelector('h2, p');
  $('#modalPanel').setAttribute('aria-label', heading ? heading.textContent.trim().slice(0, 80) : '알림');
  modal.style.display = 'flex';
}
function hideModal() { $('#modal').style.display = 'none'; }

// ------------------------------------------------------------------ keyboard
document.addEventListener('keydown', (e) => {
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
  if (e.key === 'Escape' && $('#modal').style.display === 'flex') {  // Esc = 취소 on a confirm, 닫기 otherwise
    e.preventDefault(); if ($('#modalNo')) $('#modalNo').click(); else hideModal(); return;
  }
  if (e.key === 'Escape' && $('#helpPop').classList.contains('show')) { e.preventDefault(); $('#helpPop').classList.remove('show'); return; }
  if (e.key === 'Escape' && zoom) { e.preventDefault(); closeZoom(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'z' && e.shiftKey) { e.preventDefault(); $('#btnRedo').click(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); $('#btnUndo').click(); return; }
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); return nextPending(); }
  if (e.key === ' ') { e.preventDefault(); return togglePlay(); }  // global: play/pause from cursor, selection or not
  if (e.key === 'r' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); return reel ? stopReel() : playReel(); }
  // 이음새 릴 재생 중 거슬리는 곳에서 Enter: 릴은 멈추고(다음 구간으로 안 넘어감) 그 자리에서
  // 들을 수 있게 남겨 둔다 - 모든 cut_spans 항목이 리뷰 카드로 열 수 있는 ng/block과 깔끔하게
  // 대응하진 않아(수동 병합·쉼 트림 등) 카드까지 자동으로 열지는 않는다.
  if (e.key === 'Enter' && reel && !sel) { e.preventDefault(); stopReel(); toast('릴 정지 - 이 구간에 머뭅니다'); return; }
  if (sel) {
    // ⇧↵/S mirror the review card's own 검토 완료/건너뛰기 buttons - only live while the
    // current selection matches a still-undecided review item (see matchStatus/reviewAction).
    if (e.key === 'Enter' && e.shiftKey) {
      e.preventDefault();
      const st = matchStatus(selReviewMatch);
      if (st === 'pending' || st === 'skipped') applyConfirm();
      return;
    }
    if (e.key === 'Enter') { e.preventDefault(); return toggleSel(); }  // the one shortcut for both 삭제/살리기 - see popToggle
    if (e.key === 'x') { e.preventDefault(); return playSelJoin(); }
    if (e.key === 'z') { e.preventDefault(); return openZoom(); }
    if (e.key === 's' && matchStatus(selReviewMatch) === 'pending') { e.preventDefault(); return applySkip(); }
    if (e.key === 'Escape') { clearSel(); stop(); return; }
  }
  if (e.key === 'Escape') { stop(); }
});

// ------------------------------------------------------------------ utils
let toastTimer = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 2200); }
function round3(t) { return Math.round(t * 1000) / 1000; }
function fmt(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return `${m}:${String(s).padStart(2, '0')}`; }
// tenths even past a minute: a sub-second precise cut should still move the 편집 후 길이 number
function fmtDur(t) { const d = Math.round(t * 10) / 10; return d >= 60 ? `${Math.floor(d / 60)}분 ${(d % 60).toFixed(1)}초` : `${d.toFixed(1)}초`; }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function styleKo(k) { return { NORMAL: '일반', ENUMERATION: '나열', QUOTE_TO_EXPLANATION: '인용→설명', TRANSITION: '전환', QUESTION_TO_ANSWER: '질문→답', SPEAKER_CHANGE: '화자 전환' }[k] || k; }

load();
</script>
</body>
