<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인서트 편집</title>
<link rel="icon" href="data:,">
<style>
  :root {
    /* "편집자의 교정지" 토큰 - web/index.html, web/split.html과 같은 값 (see DESIGN.md) */
    --bg: #ffffff; --panel: #fafafa; --surface-2: #f5f5f5; --ink: #171717; --muted: #666666; --line: #ebebeb; --line-strong: #a1a1a1;
    --proposal-bg: #ffefcf; --proposal-line: #ab570a;
    --accent: #0070f3; --accent-soft: #d3e5ff; --accent-ink: #ffffff; --accent-strong: #0058c0;
    --danger: #ee0000; --danger-soft: #f7d4d6;
    --chip: rgba(0,0,0,0.045); --chip-hover: rgba(0,0,0,0.08);
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 9999px;
    --sidebar-w: 260px; --right-w: clamp(320px, 30vw, 480px);
    /* 인서트 형태 색 - 타임라인 띠와 대본 밑줄이 같은 색을 쓴다 */
    --f-text: #0070f3; --f-text-soft: #d3e5ff;
    --f-image: #ab570a; --f-image-soft: #ffefcf;
    --f-video: #7c3aed; --f-video-soft: #ede4ff;
    --f-asset: #4d4d4d; --f-asset-soft: #e8e8e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 15px/1.5 -apple-system, "Geist", "Inter", "Pretendard", "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; color: inherit; }
  button:disabled { cursor: default; opacity: 0.45; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  #app { display: flex; height: 100vh; }

  /* ---------------------------------------------------------------- sidebar */
  #sidebar { width: var(--sidebar-w); flex: 0 0 auto; height: 100vh; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #sideHead { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .title-row { display: flex; align-items: center; gap: 8px; }
  #sidebar h1 { font-size: 14px; font-weight: 700; margin: 0; letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .icon-btn { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: var(--r-full); background: var(--chip); padding: 0; text-decoration: none; color: inherit; flex: 0 0 auto; }
  .icon-btn:hover { background: var(--chip-hover); }
  .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .sub a { color: inherit; }
  #counts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .count { font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-full); padding: 1px 8px; color: var(--muted); }
  .count b { color: var(--ink); font-weight: 700; }
  #sideScroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); padding: 2px 6px 6px; }
  .empty { font-size: 13px; color: var(--muted); padding: 10px 8px; line-height: 1.6; }
  .ins-item { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: var(--r-md); padding: 7px 8px; align-items: center; }
  .ins-item:hover { background: var(--chip); }
  .ins-item.active { background: var(--accent-soft); }
  .ins-item.rejected { opacity: 0.5; }
  .ins-item .tm { font-size: 12px; color: var(--muted); grid-row: 1; }
  .ins-item .tx { font-size: 13px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: keep-all; grid-column: 1 / 3; }
  .ins-item .meta { display: flex; gap: 4px; align-items: center; justify-self: end; grid-row: 1; grid-column: 2; }
  .fchip { font-size: 11px; font-weight: 700; border-radius: var(--r-full); padding: 0 7px; line-height: 18px; white-space: nowrap; }
  .fchip.text { background: var(--f-text-soft); color: var(--f-text); }
  .fchip.image { background: var(--f-image-soft); color: var(--f-image); }
  .fchip.video { background: var(--f-video-soft); color: var(--f-video); }
  .fchip.asset { background: var(--f-asset-soft); color: var(--f-asset); }
  .fchip.none { background: var(--chip); color: var(--muted); }
  .schip { font-size: 11px; border-radius: var(--r-full); padding: 0 7px; line-height: 18px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); background: var(--bg); }
  .schip.approved { background: var(--ink); color: #fff; border-color: var(--ink); }
  .schip.ready { color: var(--proposal-line); border-color: var(--proposal-line); }
  .schip.error { color: var(--danger); border-color: var(--danger); }
  .schip.busy { color: var(--accent-strong); border-color: var(--accent-soft); background: var(--accent-soft); }
  .schip.sug { border-style: dashed; color: var(--muted); }
  #sideFoot { padding: 12px 16px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .primary { background: var(--ink); color: #fff; border: 0; border-radius: var(--r-md); padding: 9px 14px; font-weight: 600; font-size: 14px; }
  .primary:hover:not(:disabled) { background: #000; }
  .btn { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 6px 12px; font-size: 13px; }
  .btn:hover:not(:disabled) { border-color: var(--line-strong); }
  .note { font-size: 12px; color: var(--muted); line-height: 1.55; }

  /* ---------------------------------------------------------------- main: 타임라인 띠 + 대본 */
  #main { flex: 1 1 auto; height: 100vh; overflow-y: auto; position: relative; min-width: 0; }
  #tlWrap { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,0.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 12px 28px 10px; }
  #tlHead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
  #tlHead .ttl { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
  .legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .legend .pending { background: repeating-linear-gradient(135deg, var(--line-strong) 0 2px, transparent 2px 4px); border: 1px solid var(--line-strong); }
  #tl { position: relative; height: 40px; background: var(--surface-2); border-radius: var(--r-sm); cursor: pointer; user-select: none; }
  #tl .tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(0,0,0,0.07); }
  #tl .tick span { position: absolute; top: 100%; left: -10px; font: 10px/1.6 var(--mono); color: var(--muted); }
  #tl .blk { position: absolute; top: 12px; bottom: 6px; min-width: 3px; border-radius: 3px; }
  /* 구조 층(섹션 바·목록)은 위쪽 얇은 줄 - 다른 인서트와 같은 시간에 겹쳐 뜬다 */
  #tl .blk.struct { top: 2px; bottom: auto; height: 7px; border-radius: 2px; }
  #tl .blk.struct.sug { top: 2px; height: 7px; border-width: 1px; }
  #tl .blk.text { background: var(--f-text); } #tl .blk.image { background: var(--f-image); } #tl .blk.video { background: var(--f-video); } #tl .blk.asset { background: var(--f-asset); } #tl .blk.none { background: var(--line-strong); }
  /* 확인 전(만들어졌지만 승인 안 함)은 빗금, 만드는 중은 흐리게, 승인은 꽉 찬 색 */
  #tl .blk.pending { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.55) 0 3px, transparent 3px 6px); }
  #tl .blk.busy { opacity: 0.4; animation: pulse 1.2s ease-in-out infinite; }
  #tl .blk.err { background: var(--danger) !important; }
  #tl .blk.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
  /* 제안만 된 것(아직 안 만듦)은 테두리만 점선 */
  #tl .blk.sug { background: transparent !important; border: 2px dashed; top: 8px; bottom: 8px; }
  #sugBar { display: none; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin: 0 0 8px; flex-wrap: wrap; }
  #sugBar .btn { padding: 2px 10px; font-size: 12px; }
  @keyframes pulse { 50% { opacity: 0.15; } }
  #tl #playhead { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--danger); pointer-events: none; }
  #tlTip { position: fixed; z-index: 20; display: none; background: var(--ink); color: #fff; font-size: 12px; padding: 4px 8px; border-radius: var(--r-sm); pointer-events: none; max-width: 320px; }
  #tlFoot { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 18px; }

  #doc { max-width: 860px; padding: 20px 28px 50vh; }
  .sent { display: grid; grid-template-columns: 50px 1fr; gap: 10px; padding: 1px 6px; margin: 0 -6px; border-radius: var(--r-sm); font-size: 17px; line-height: 1.95; }
  .sent .ts { font-size: 12px; color: var(--muted); padding-top: 7px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .w { cursor: text; }
  .sent .ts:hover { color: var(--accent); }
  .sent.playing .ts { color: var(--danger); font-weight: 700; }
  .w { border-radius: 2px; }
  .w.now { background: #fff3b0; }
  /* 인서트가 붙은 말 - 형태 색 밑줄. 확인 전은 점선, 승인은 실선 */
  .w.ins { cursor: pointer; text-decoration-line: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; text-decoration-style: dotted; }
  .w.ins.ok { text-decoration-style: solid; }
  .w.ins.text { text-decoration-color: var(--f-text); } .w.ins.image { text-decoration-color: var(--f-image); } .w.ins.video { text-decoration-color: var(--f-video); } .w.ins.asset { text-decoration-color: var(--f-asset); } .w.ins.none { text-decoration-color: var(--line-strong); }
  .w.ins.sel { background: var(--accent-soft); }
  .w.ins.sug { text-decoration-thickness: 2px; text-decoration-style: dashed; opacity: 0.85; }
  /* 들어가는 자리 - 편집본 시간축 파형 + 대본. 좌우로 스크롤하며 양 끝을 끌어 정한다 */
  .span-lbl { display: flex; align-items: center; gap: 6px; }
  .span-lbl .btn { padding: 0 10px; font-size: 12px; line-height: 22px; }
  /* overscroll 막기 - 트랙패드로 좌우 스크롤하다 끝에 닿으면 브라우저 '뒤로 가기'가 되지 않게 */
  /* 여러 줄로 접어 스크롤 없이 한 번에 - 한 줄 가로 스크롤은 길어서 조정이 어려웠다 (10-12 사용자 요청). 넘칠 때만 세로 스크롤 */
  #spanScroll { overflow-x: hidden; overflow-y: auto; max-height: calc(100vh - 150px); overscroll-behavior: contain; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg); padding: 6px; }
  #spanInner { position: relative; }
  #spanCv { display: block; cursor: pointer; }
  #spanHead { position: absolute; top: 0; width: 2px; background: var(--danger); pointer-events: none; display: none; }
  #mkBtn { position: absolute; z-index: 10; display: none; background: var(--ink); color: #fff; border: 0; border-radius: var(--r-full); padding: 6px 14px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
  #mkBtn:hover { background: #000; }

  /* ---------------------------------------------------------------- right: 영상 + 상세 */
  #right { width: var(--right-w); flex: 0 0 auto; height: 100vh; border-left: 1px solid var(--line); display: flex; flex-direction: column; background: var(--bg); }
  #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; flex: 0 0 auto; }
  #stage video, #stage .ov { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #stage .ov { pointer-events: none; }
  #stageBadge { position: absolute; left: 8px; bottom: 8px; display: none; font-size: 11px; background: rgba(0,0,0,0.6); color: #fff; padding: 1px 7px; border-radius: var(--r-full); }
  #vbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #vbar .t { font-size: 12px; color: var(--muted); margin-left: auto; }
  #detail { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 14px 40px; background: var(--panel); }
  /* 결정 바 - 영상 바로 아래 고정. 상태가 바뀌어도 같은 자리에서 버튼만 바뀐다 */
  #decisionBar { flex: 0 0 auto; padding: 10px 14px 12px; border-bottom: 1px solid var(--line); background: var(--bg); }
  #decisionBar .db-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 24px; }
  #decisionBar .db-time { font-size: 12px; color: var(--muted); }
  #decisionBar .db-nav { margin-left: auto; display: flex; gap: 4px; }
  #decisionBar .db-nav button { width: 30px; height: 26px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); padding: 0; font-size: 12px; }
  #decisionBar .db-nav button:hover:not(:disabled) { border-color: var(--line-strong); }
  #decisionBar .db-act { display: flex; gap: 6px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  #decisionBar .db-act .primary { flex: 1 1 auto; padding: 10px 14px; }
  #decisionBar .db-act .btn { padding: 9px 14px; }
  #decisionBar .db-done { flex: 1 1 auto; font-weight: 700; font-size: 14px; }
  #decisionBar .db-done.ok { color: var(--ink); }
  #decisionBar .db-done.no { color: var(--muted); }
  #decisionBar .db-hint { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .k { font: 600 10.5px/1 var(--mono); opacity: 0.65; margin-left: 6px; padding: 2px 4px; border-radius: 3px; background: rgba(255,255,255,0.18); }
  .btn .k { background: rgba(0,0,0,0.06); }
  /* 상세 - 할 일별 카드 */
  .card-sec { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px; margin-top: 10px; }
  .card-sec > h3 { margin: 0; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .card-sec > h3 .num { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: #fff; font: 700 11px/18px var(--mono); text-align: center; flex: 0 0 auto; }
  .card-sec > .desc { font-size: 12px; color: var(--muted); margin: 2px 0 8px 24px; }
  .card-sec .sub { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .card-sec .sub:first-of-type { border-top: 0; padding-top: 0; margin-top: 4px; }
  .card-sec .sub .lbl { font-size: 12px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  #detail h2 { font-size: 15px; margin: 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .quote { margin: 10px 0; padding: 8px 12px; background: var(--panel); border-left: 3px solid var(--line-strong); border-radius: var(--r-sm); font-size: 14px; line-height: 1.6; }
  .reason { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 8px 0; }
  .warn { font-size: 13px; color: var(--proposal-line); background: var(--proposal-bg); border-radius: var(--r-sm); padding: 6px 10px; margin: 6px 0; line-height: 1.55; }
  .errbox { font-size: 13px; color: var(--danger); background: var(--danger-soft); border-radius: var(--r-sm); padding: 8px 10px; margin: 8px 0; line-height: 1.55; }
  .errcard { font-size: 13px; line-height: 1.55; border: 1px solid #f3b4b8; background: #fff5f5; border-radius: var(--r-md); padding: 9px 11px; margin-top: 8px; }
  .errcard .et { color: var(--danger); font-weight: 700; }
  .errcard .es { color: var(--muted); font-size: 12px; }
  .errcard .eh { color: var(--ink); margin-top: 2px; }
  .errcard details { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .errcard details summary { cursor: pointer; }
  .errcard pre { white-space: pre-wrap; word-break: break-all; font: 11.5px/1.45 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 8px; margin: 6px 0 0; max-height: 160px; overflow: auto; }
  .errcard .row { margin-top: 8px; }
  .notice { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: var(--r-sm); padding: 6px 10px; margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .notice button { margin-left: auto; }
  .busy { font-size: 14px; color: var(--accent-strong); padding: 14px 0; display: flex; gap: 8px; align-items: center; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .pv { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: var(--r-md); overflow: hidden; margin: 10px 0 4px;
    background: #2b2b2b repeating-conic-gradient(#333 0 25%, #2b2b2b 0 50%) 0 0 / 20px 20px; }
  .pv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .cands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .cands button { padding: 0; border: 2px solid transparent; border-radius: var(--r-sm); overflow: hidden; background: #000; aspect-ratio: 16/9; }
  .cands button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cands button.on { border-color: var(--accent); }
  .style-card { cursor: pointer; }
  .style-card.focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .sl { display: grid; grid-template-columns: 52px 1fr 58px; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .sl input[type=range] { width: 100%; accent-color: var(--accent); }
  .sl .val { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--ink); }
  .tag { font-size: 11px; border-radius: var(--r-full); padding: 0 7px; line-height: 18px; background: var(--chip); color: var(--muted); font-weight: 400; white-space: nowrap; }
  .tag.ch { background: var(--accent-soft); color: var(--accent-strong); }
  /* 영상 설정 - 이 영상의 인서트 전체에 걸리는 값. 누르면 오른쪽 패널이 그 설정으로 바뀐다 */
  #vset { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg); overflow: hidden; }
  #vset .vh { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); padding: 7px 10px 3px; }
  .vrow { display: grid; grid-template-columns: 22px 1fr auto 10px; gap: 6px; align-items: center; width: 100%; border: 0; background: transparent; text-align: left; padding: 7px 10px; font-size: 13px; }
  .vrow + .vrow { border-top: 1px solid var(--line); }
  .vrow:hover { background: var(--chip); }
  .vrow.on { background: var(--accent-soft); color: var(--accent-strong); }
  .vrow .ic { font: 700 12px/1 var(--mono); color: var(--muted); text-align: center; }
  .vrow.on .ic { color: var(--accent-strong); }
  .vrow .vv { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .vrow.on .vv { color: var(--accent-strong); }
  .vrow .chev { color: var(--line-strong); font-size: 12px; }
  .sfx-mark { font-size: 11px; color: var(--muted); }
  .sfx-row { display: grid; grid-template-columns: 40px 1fr auto 30px; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .sfx-row:first-of-type { border-top: 0; }
  .sfx-row .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .sfx-row .nm:hover { color: var(--accent-strong); }
  .sfx-row .btn { padding: 3px 0; }
  .confirm-row { margin-top: 8px; padding: 9px 11px; border: 1px solid var(--accent-soft); background: #f5f9ff; border-radius: var(--r-md); font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .confirm-row .primary { padding: 7px 14px; font-size: 13px; }
  .cands button { position: relative; }
  .cands .vd { position: absolute; left: 4px; top: 4px; font-size: 11px; font-weight: 700; border-radius: var(--r-full); padding: 0 6px; line-height: 17px; }
  .cands .vd.ok { background: #fff; color: var(--accent-strong); }
  .cands .vd.no { background: var(--danger); color: #fff; }
  .sec { margin-top: 14px; }
  .sec .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 6px; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: var(--r-md); font-size: 13px; display: none; z-index: 30; }

  #modal .box { background: var(--bg); border-radius: var(--r-lg); padding: 20px 22px; max-width: 520px; width: calc(100% - 32px); box-shadow: 0 12px 40px rgba(0,0,0,0.2); font-size: 14px; line-height: 1.6; }
  /* 위치 조정 팝업 - 아래쪽에 넓게. 위의 영상·대본이 가려지지 않아 보면서 맞출 수 있다 */
  #modal.sheet { align-items: flex-end; background: rgba(0,0,0,0.12); }
  #modal.sheet .box { max-width: min(1280px, calc(100vw - 48px)); margin-bottom: 24px; padding: 14px 16px 16px; }
  .span-pop-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .span-pop-head b { font-size: 14px; }

  .span-pop-head .sp { margin-left: auto; display: flex; gap: 6px; }
  #modal code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; word-break: break-all; }
  @media (max-width: 980px) { #sidebar { display: none; } }
</style>

        <button class="vrow" data-panel="sfx"><span class="ic">♪</span><span>효과음 크기</span><span class="vv" id="vsSfx"></span><span class="chev">›</span></button>

<div id="modal"><div class="box" id="modalBox" role="dialog" aria-modal="true"></div></div>

<script>
// 화면 오류를 서버 로그에 남긴다 - 홈 화면 "로그 공유"로 받았을 때 화면 버그 원인을 찾을 수 있게.
// 본 스크립트에 문법 오류가 있어도 잡히도록 따로 먼저 둔다.
(() => {
  let sent = 0;
  const report = (kind, message, stack, src) => {
    if (sent++ >= 20) return;  // 같은 오류가 반복돼도 로그를 덮지 않게
    fetch('/api/client_error', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind, message: String(message), stack: String(stack || ''), src: src || '', page: location.pathname }) }).catch(() => {});
  };
  window.addEventListener('error', (e) => report('error', e.message, e.error && e.error.stack, e.filename ? `${e.filename}:${e.lineno}:${e.colno}` : ''));
  window.addEventListener('unhandledrejection', (e) => { const r = e.reason; report('promise', (r && r.message) || r, r && r.stack); });
})();
</script>
<script>
const $ = (q) => document.querySelector(q);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (sec) => { sec = Math.max(0, Math.round(sec || 0)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; };
const FORM_KO = { text: '텍스트', image: '이미지', video: '영상', asset: '실물' };
const STATUS_KO = { suggested: '제안', deciding: '형태 정하는 중', generating: '만드는 중', ready: '확인 전', approved: '승인', rejected: '취소',
  error: '오류', unsupported: '영상 준비 중', needs_asset: '자료 필요' };
const LAYOUT_KO = { top: '상단 요약·섹션 바', comment: '노란 코멘트', chapter: '챕터 카드(어둡게)', quote: '인용 카드(어둡게)', list: '좌상단 목록' };
const BUSY = new Set(['deciding', 'generating']);
// 생성 비용·시간 - 돈이 드는 생성은 항상 이걸 보여 준 뒤 한 번 더 눌러야 시작한다
const COST = { text: '바로 · 거의 무료', image: '약 30초 · 약 $0.2', video: '약 3~5분 · 약 $1', asset: '파일 올리기' };
let pendingForm = null;  // {id, form} - 형태 바꾸기에서 고른 뒤 '만들기' 확인 대기

let S = null;            // /api/insert/state
let selId = null;        // 상세 패널에 보이는 인서트
let kept = [];           // 원본에서 남은 구간 [{s,e,o}] - o = 편집본 시작
let pollTimer = null;
const video = $('#video');

function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), ms); }
function showModal(html, sheet = false) { $('#modalBox').innerHTML = html; $('#modal').classList.toggle('sheet', sheet); $('#modal').style.display = 'flex'; }
function hideModal() { $('#modal').style.display = 'none'; $('#modal').classList.remove('sheet'); spanTrack = null; spanPopId = null; }
const modalOpen = () => $('#modal').style.display === 'flex';
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') hideModal(); });
const fileUrl = (f) => `/api/insert/file?f=${encodeURIComponent(f)}`;

async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '실패했습니다');
  return j;
}

// ---------------------------------------------------------------- 시간 변환 (원본 <-> 편집본)
function buildKept() {
  const spans = [...S.cut_spans].sort((a, b) => a.start - b.start);
  kept = []; let cur = 0, acc = 0;
  for (const c of spans) {
    if (c.start > cur) { kept.push({ s: cur, e: c.start, o: acc }); acc += c.start - cur; }
    cur = Math.max(cur, c.end);
  }
  if (cur < S.duration_src) kept.push({ s: cur, e: S.duration_src, o: acc });
}
function toOut(t) {
  for (const k of kept) { if (t < k.s) return k.o; if (t < k.e) return k.o + (t - k.s); }
  return S.duration_out;
}
function toSrc(o) {
  for (const k of kept) { if (o < k.o + (k.e - k.s)) return k.s + Math.max(0, o - k.o); }
  return kept.length ? kept[kept.length - 1].e : 0;
}

// ---------------------------------------------------------------- 로드
async function load() {
  S = await (await fetch('/api/insert/state')).json();
  if (S.error) { $('#doc').innerHTML = `<p class="empty">${esc(S.error)}</p>`; return; }
  document.title = `인서트 편집 · ${S.name}`;
  $('#title').textContent = `인서트 편집 · ${S.name}`;
  $('#homeLink').href = `http://127.0.0.1:${S.home_port || 8764}/`;
  $('#backCut').href = '/';
  if (S.insert_only) $('#backCut').parentElement.style.display = 'none';
  if (!video.src) {
    video.src = '/media';
    // 첫 프레임이 검게 비지 않게 - 남은 첫 말 위치로
    video.addEventListener('loadedmetadata', () => { if (video.currentTime === 0 && S.words.length) video.currentTime = S.words[0].s; }, { once: true });
  }
  buildKept();
  renderDoc();
  const want = location.hash.slice(1);  // /insert#<인서트 id> - 그 인서트를 골라 연다
  if (want && S.items.some((i) => i.id === want)) selId = want;
  renderAll();
  schedulePoll();
  if (selId) setTimeout(() => select(selId, true), 0);
}
let lastDetailKey = '';
function renderAll() {
  renderCounts(); renderList(); renderTimeline(); paintInserts(); renderFontWarn(); renderSugBar(); renderVset(); sfxPreload();
  // 상세는 바뀌었을 때만 다시 그린다 - 매번 그리면 미리보기 영상이 새로 만들어져 본 영상 재생이 끊기고 싱크가 밀린다
  if (panel) {  // 슬라이더를 끄는 중에 폴링이 패널을 다시 그리지 않게 - 그 설정 값이 바뀌었을 때만
    const sk = panelKey();
    if (sk !== lastDetailKey) { lastDetailKey = sk; renderPanel(); }
    return;
  }
  const it = S.items.find((i) => i.id === selId);
  const key = JSON.stringify([selId, it, pendingForm]);
  if (key !== lastDetailKey && !spanDrag) { lastDetailKey = key; renderDetail(); } else renderDecisionBar();
}
function renderSugBar() {
  const bar = $('#sugBar'); const sg = S.suggest || { state: 'none' };
  const hasAny = S.items.some((i) => i.status !== 'rejected');
  const again = `<button class="btn" id="sugAgain">${hasAny ? '추가 제안' : '자리 제안'}</button>`;
  bar.style.display = sg.state === 'none' ? 'none' : 'flex';
  if (sg.state === 'running') bar.innerHTML = `<span class="spin"></span>${sg.cancel ? '중단하는 중…' : '자리 제안 중… (1~3분)'}
    ${sg.cancel ? '' : '<button class="btn" id="sugCancel">중단</button>'}`;
  else if (sg.state === 'cancelled') bar.innerHTML = `자리 제안을 중단했어요${again}`;
  else if (sg.state === 'error') bar.innerHTML = `<div style="flex:1 1 100%">${errorBlock(sg.error_info || { title: `자리 제안 실패: ${sg.error}`, hint: '아래 버튼으로 다시 해 보세요', raw: '' }, again)}</div>`;
  else if (sg.state === 'done') {
    const n = S.items.filter((i) => i.origin === 'suggest').length;
    const added = sg.added != null ? `방금 ${sg.added ? `${sg.added}개 추가` : '더 넣을 자리 없음'} · ` : '';
    bar.innerHTML = `${added}제안 ${n}개${again}`;
  }
  $('#sugCancel')?.addEventListener('click', async () => {
    try { await api('/api/insert/suggest/cancel'); S.suggest = { ...S.suggest, cancel: true }; renderSugBar(); toast('중단하는 중'); } catch (e) { toast(e.message); }
  });
  $('#sugAgain')?.addEventListener('click', async () => {
    if (hasAny && !confirm('지금 있는 인서트는 그대로 두고, 대본 전체를 다시 읽어 빈 구간 중 넣을 만한 곳만 더 제안할까요? (영상당 약 $0.3)')) return;
    try { await api('/api/insert/suggest'); S.suggest = { state: 'running' }; renderSugBar(); schedulePoll(); } catch (e) { toast(e.message); }
  });
}
function renderFontWarn() {
  const box = $('#fontWarn'); const miss = S.fonts_missing || [];
  if (!miss.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = `글꼴 <b>${miss.map(esc).join(', ')}</b>을(를) 받지 못했어요 (인터넷 연결 확인). 지금 만드는 글자는 대체 글꼴로 나와요.
    <button class="btn" id="fontRetry" style="margin-left:8px;padding:2px 10px">다시 받기</button>`;
  $('#fontRetry').addEventListener('click', async () => {
    toast('글꼴 받는 중…');
    try { const r = await api('/api/insert/fonts'); S.fonts_missing = r.fonts_missing; renderFontWarn();
      toast(r.fonts_missing.length ? '아직 받지 못했어요' : '글꼴을 받았어요 - 대체 글꼴로 만든 인서트는 "글자 반영"을 누르면 다시 그려요'); }
    catch (e) { toast(e.message); }
  });
}

async function refresh() {
  const prevSel = selId;
  const prevStatus = S.items.find((i) => i.id === prevSel)?.status;
  const st = await (await fetch('/api/insert/state')).json();
  const cutsChanged = JSON.stringify(st.cut_spans) !== JSON.stringify(S.cut_spans);
  S = st;
  if (cutsChanged) { buildKept(); renderDoc(); }
  selId = S.items.some((i) => i.id === prevSel) ? prevSel : null;
  // 다른 인서트를 만드는 동안의 폴링이 입력 중인 글자를 지우지 않게 - 선택한 인서트 상태가 그대로면 상세 패널은 두고
  const typing = $('#detail').contains(document.activeElement) && document.activeElement.matches('textarea, input:not([type=range]), select');
  if (typing && S.items.find((i) => i.id === selId)?.status === prevStatus) {
    renderCounts(); renderList(); renderTimeline(); paintInserts(); renderDecisionBar();
  } else renderAll();
  schedulePoll();
}
function schedulePoll() {
  clearTimeout(pollTimer);
  if (S.items.some((i) => BUSY.has(i.status)) || S.suggest?.state === 'running' || S.sfx_mix?.measuring) pollTimer = setTimeout(refresh, 1500);
}

// ---------------------------------------------------------------- 대본 (잘린 말은 안 보임)
function renderDoc() {
  const doc = $('#doc'); doc.innerHTML = '';
  let cur = []; const sents = [];
  for (const w of S.words) { cur.push(w); if (/[.?!]$/.test(w.t)) { sents.push(cur); cur = []; } }
  if (cur.length) sents.push(cur);
  const frag = document.createDocumentFragment();
  for (const s of sents) {
    const row = document.createElement('div'); row.className = 'sent'; row.dataset.s = s[0].s;
    const ts = document.createElement('span'); ts.className = 'ts mono'; ts.textContent = fmt(s[0].o); ts.title = '여기부터 재생';
    ts.addEventListener('click', () => { video.currentTime = s[0].s; video.play(); });
    const tx = document.createElement('span'); tx.className = 'txt';
    s.forEach((w, k) => {
      const sp = document.createElement('span'); sp.className = 'w'; sp.dataset.wi = w.wi; sp.textContent = w.t;
      tx.appendChild(sp); if (k < s.length - 1) tx.appendChild(document.createTextNode(' '));
    });
    row.append(ts, tx); frag.appendChild(row);
  }
  doc.appendChild(frag);
  if (!S.words.length) doc.innerHTML = '<p class="empty">남은 대본이 없습니다.</p>';
}

function wordEl(wi) { return document.querySelector(`.w[data-wi="${wi}"]`); }
function paintInserts() {
  document.querySelectorAll('.w.ins').forEach((el) => { el.className = 'w'; delete el.dataset.ins; });
  // 구조 층(섹션 바)을 먼저 칠하고 그 위에 다른 인서트를 칠한다 - 겹치면 더 구체적인 인서트가 보이게
  const isStruct = (i) => i.decision?.layer === '구조' && ['top', 'list'].includes(i.decision?.layout);
  for (const it of [...S.items].sort((a, b) => isStruct(b) - isStruct(a))) {
    if (it.status === 'rejected') continue;
    for (let wi = it.wi_start; wi <= it.wi_end; wi++) {
      const el = wordEl(wi); if (!el) continue;
      el.className = `w ins ${it.form || 'none'}${it.status === 'approved' ? ' ok' : ''}${it.status === 'suggested' ? ' sug' : ''}${it.id === selId ? ' sel' : ''}`;
      el.dataset.ins = it.id;
    }
  }
}

// ---------------------------------------------------------------- 목록 + 숫자
function sortedItems() { return [...S.items].sort((a, b) => (a.t_start ?? 0) - (b.t_start ?? 0)); }
function renderCounts() {
  const n = (st) => S.items.filter((i) => st.includes(i.status)).length;
  const c = [['전체', S.items.length], ['승인', n(['approved'])], ['확인 전', n(['ready'])], ['제안', n(['suggested'])], ['진행 중', n(['deciding', 'generating'])],
    ['확인 필요', n(['error', 'unsupported', 'needs_asset'])]].filter(([k, v]) => v || k === '전체');
  $('#counts').innerHTML = c.map(([k, v]) => `<span class="count">${k} <b>${v}</b></span>`).join('');
}
function statusChip(it) {
  const cls = it.status === 'approved' ? 'approved' : it.status === 'ready' ? 'ready' : it.status === 'suggested' ? 'sug' : BUSY.has(it.status) ? 'busy'
    : ['error', 'unsupported', 'needs_asset'].includes(it.status) ? 'error' : '';
  return `<span class="schip ${cls}">${STATUS_KO[it.status] || it.status}</span>`;
}
function formChip(it) { return `<span class="fchip ${it.form || 'none'}">${it.form ? FORM_KO[it.form] : '형태 미정'}</span>`; }
function itemLabel(it) { const l = (it.decision?.lines || []).filter(Boolean).join(' / '); return l || it.text; }
let listScrolledFor = null;
function renderList() {
  const list = $('#list');
  if (!S.items.length) {
    list.innerHTML = `<div class="empty">대본을 드래그해 인서트를 만드세요</div>`;
    return;
  }
  list.innerHTML = '';
  for (const it of sortedItems()) {
    const b = document.createElement('button');
    b.className = `ins-item${it.id === selId ? ' active' : ''}${it.status === 'rejected' ? ' rejected' : ''}`;
    b.innerHTML = `<span class="tm mono">${fmt(it.t_start)}${it.sfx ? ' <span class="sfx-mark" title="효과음">♪</span>' : ''}</span><span class="meta">${formChip(it)}${statusChip(it)}</span><span class="tx">${esc(itemLabel(it))}</span>`;
    b.addEventListener('click', () => select(it.id, true));

const sfxLive = new Set();  // 지금 소리 나는 효과음 - 영상을 멈추거나 다른 곳으로 옮기면 같이 끈다
function sfxStopAll() { for (const src of sfxLive) { try { src.stop(); } catch (e) { /* 이미 끝남 */ } } sfxLive.clear(); }
async function sfxPlay(id, db) {
  if (!id) return;
  try {
    const buf = await sfxLoad(id);
    if (actx.state === 'suspended') await actx.resume();
    const src = actx.createBufferSource(); src.buffer = buf;
    const g = actx.createGain(); g.gain.value = Math.pow(10, (db ?? 0) / 20);
    src.connect(g).connect(actx.destination); src.start();
    sfxLive.add(src); src.onended = () => sfxLive.delete(src);
  } catch (e) { /* 재생 실패는 조용히 - 편집은 계속 */ }
}
// 효과음만 듣기(▶) - 누를 때마다 겹쳐 쌓이지 않게 앞의 소리를 끊고
function sfxPreview(id, db) { sfxStopAll(); sfxPlay(id, db); }
// 잘린 구간을 건너뛰는 이동(cutSkipSeek)은 빼고 - FCP에서는 효과음이 컷을 넘어 계속 나니 미리보기도 끊지 않는다
video.addEventListener('seeking', () => { if (cutSkipSeek) cutSkipSeek = false; else sfxStopAll(); });
// 첫 클릭 때 오디오를 깨우고 쓰는 효과음을 미리 받아 둔다 - 재생 중 인서트 시작 지점에서 늦게 나지 않게
document.addEventListener('pointerdown', () => { if (!actx) { actx = new AudioContext(); sfxPreload(); } }, { once: true, capture: true });
function playSfxOf(id) { const i = S.items.find((x) => x.id === id); if (i?.sfx) sfxPreview(i.sfx, i.sfx_db); }
const pctOf = (it) => it.sfx_pct ?? S.sfx_mix?.pct ?? 100;
const dbTxt = (db) => db == null ? '' : `${db > 0 ? '+' : ''}${db.toFixed(1)}dB`;

// 오류 카드: 무엇이(어느 단계에서) 잘못됐고 어떻게 하면 되는지 + 원문은 '자세히' 안에

// 들어가는 자리: 편집본 시간축(잘린 곳은 이어 붙임)에 파형 + 대본을 깔고, 인서트 구간의 양 끝을 끌어 정한다.
// 컷편집 정밀 조정과 같은 방식 - 다만 인서트는 말 단위로 붙으니 끝은 말 경계에 붙는다. 영상(모션)은 길이에 맞춰 렌더돼 보기만
const IMAGE_MAX_SEC = 5;  // scripts/inserts.py IMAGE_MAX_SEC와 같은 값 - 만들 때만 적용, 직접 늘리는 건 자유
const SPAN_PPS = 150, SPAN_MIN_PPS = 30, SPAN_PAD = 8;  // 1초당 px(최대·최소), 구간 앞뒤로 보여 줄 초
const SPAN_LABEL_H = 36, SPAN_H = 96, SPAN_GAP = 10;  // 줄 하나의 높이·줄 사이. 글자는 두 단으로 엇갈려 - 짧은 말도 옆 말 자리까지 쓴다
const FORMS = ['text', 'image', 'video', 'asset'];
const waveCache = [];   // [{a, b, peaks}] 원본 시각 - 자리를 조금 옮겨도 다시 받지 않게 앞뒤로 넉넉히 받아 둔다
let spanTrack = null;   // 지금 상세에 그려진 자리 트랙
let spanDrag = false;   // 끝을 끄는 중 - 그동안 폴링이 상세를 다시 그리지 않게
let spanStopAt = null;  // ▶ 듣기 - 원본 시각으로 여기서 멈춤
const spanHit = (o, s, e) => o.wi_start <= e && s <= o.wi_end;  // 인서트 o가 말 s~e와 겹치나
const spanTop = {};     // 인서트 id -> 보던 세로 스크롤 (자리를 바꿔 다시 그려도 유지)

let spanPopId = null;   // 위치 조정 팝업에 열린 인서트
// 상세에는 길이와 버튼만 - 어느 말에 붙는지는 대본 밑줄로 이미 보이고, 긴 파형은 좁은 상세에서 다루기 어렵다 (10-12 사용자 요청)
function spanBox(it, busy) {
  const ok = S.words.some((w) => w.wi === it.wi_start) && S.words.some((w) => w.wi === it.wi_end);
  const dur = (it.t_end ?? 0) - (it.t_start ?? 0);
  const over = it.form === 'image' && dur > IMAGE_MAX_SEC + 0.05;
  const edit = ok && !busy && it.form !== 'video';
  return `<div class="sub"><div class="lbl span-lbl">들어가는 자리 · <span class="mono">${dur.toFixed(1)}초</span>
      <span style="margin-left:auto;display:flex;gap:6px">${ok ? '<button class="btn" id="dSpanPlay">▶ 듣기</button>' : ''}${edit ? '<button class="btn" id="dSpanEdit">위치 조정</button>' : ''}</span></div>
    ${over ? `<div class="warn" style="margin-bottom:0">이미지 기본 최대 ${IMAGE_MAX_SEC}초보다 길어요</div>` : ''}</div>`;
}
function spanListen(it) {  // 인서트 구간만 듣기 - 끝에서 멈춤
  video.currentTime = it.src_start; spanStopAt = it.src_end; video.play();
}
function openSpanPopup(id) {
  const it = S.items.find((i) => i.id === id); if (!it) return;
  const dur = (it.t_end ?? 0) - (it.t_start ?? 0);
  spanPopId = id;
  showModal(`<div class="span-pop-head"><b>들어가는 자리</b><span class="mono" id="spanDur">${dur.toFixed(1)}초</span>
      <span class="sp"><button class="btn" id="spanPlay">▶ 듣기</button><button class="btn" id="spanClose">닫기</button></span></div>
    <div id="spanScroll"><div id="spanInner"><canvas id="spanCv"></canvas><div id="spanHead"></div></div></div>
    <div class="warn" id="spanOver" style="display:none;margin-bottom:0">이미지 기본 최대 ${IMAGE_MAX_SEC}초보다 길어요</div>`, true);
  $('#spanClose').addEventListener('click', hideModal);
  mountSpanTrack(it, BUSY.has(it.status));
}
async function spanPeaks(srcA, srcB) {
  const hit = waveCache.find((c) => c.a <= srcA + 0.01 && c.b >= srcB - 0.01);
  if (hit) return hit;
  const a = Math.max(0, srcA - 10), b = Math.min(S.duration_src, srcB + 10);
  try {
    const r = await (await fetch(`/api/waveform?start=${a}&end=${b}&buckets=${Math.ceil((b - a) * 100)}`)).json();
    if (!r.peaks?.length) return null;
    const c = { a: r.start, b: r.end, peaks: r.peaks };
    waveCache.push(c); if (waveCache.length > 8) waveCache.shift();
    return c;
  } catch (e) { return null; }  // 파형 없이도 대본으로 자리는 정할 수 있다
}
// 트랙은 한 줄짜리 시간축(x = 편집본 시각 × pps)으로 계산하고, 그릴 때만 말 경계에서 여러 줄로 접는다.
// rows[r] = 한 줄이 맡는 x 구간. spanPos/spanAt이 시간축 x <-> 캔버스 위치를 오간다
function spanRows(words, w, W) {
  const rows = []; let start = 0;
  for (const wd of words) if (wd.x1 - start > W && wd.x0 > start) { rows.push({ x0: start, x1: wd.x0 }); start = wd.x0; }
  rows.push({ x0: start, x1: w });
  return rows;
}
const spanRowY = (r) => r * (SPAN_H + SPAN_GAP);
function spanPos(tr, x, end = false) {  // end: 줄 경계에 딱 걸리면 앞줄 끝으로 (구간의 끝 손잡이)
  let r = tr.rows.findIndex((row) => (end ? x > row.x0 && x <= row.x1 : x >= row.x0 && x < row.x1));
  if (r < 0) r = x <= 0 ? 0 : tr.rows.length - 1;
  return { r, cx: x - tr.rows[r].x0, cy: spanRowY(r) };
}
function spanAt(tr, cx, cy) {  // 캔버스 위치 -> 시간축 x
  const r = Math.max(0, Math.min(tr.rows.length - 1, Math.floor(cy / (SPAN_H + SPAN_GAP))));
  const row = tr.rows[r];
  return { r, x: row.x0 + Math.max(0, Math.min(row.x1 - row.x0, cx)) };
}
function mountSpanTrack(it, busy) {
  spanTrack = null;
  const sc = $('#spanScroll'); if (!sc) return;
  const ws = S.words, iS = ws.findIndex((w) => w.wi === it.wi_start), iE = ws.findIndex((w) => w.wi === it.wi_end);
  const o0 = ws[iS].o, o1 = toOut(ws[iE].e);
  const a = Math.max(0, o0 - SPAN_PAD), b = Math.min(S.duration_out, o1 + SPAN_PAD);
  // 스크롤 없이 한 번에 보이게: 화면 높이에 들어가는 줄 수 안에 다 담기도록 1초당 px를 줄인다 (10-12 사용자 요청).
  // 줄은 말 경계에서 끊어 끝이 조금씩 비니 실제로 접어 보고 넘치면 더 줄인다
  const W = Math.max(200, sc.clientWidth - 12);
  const maxRows = Math.max(1, Math.floor((window.innerHeight - 150 - 12 + SPAN_GAP) / (SPAN_H + SPAN_GAP)));
  const inRange = ws.filter((w) => w.o < b && toOut(w.e) > a);
  const layout = (pps) => {
    const words = inRange.map((w) => ({ wi: w.wi, t: w.t, s: w.s, e: w.e, x0: (w.o - a) * pps, x1: (toOut(w.e) - a) * pps }));
    const w = Math.ceil((b - a) * pps);
    return { pps, words, w, rows: spanRows(words, w, W) };
  };
  let L = layout(Math.max(SPAN_MIN_PPS, Math.min(SPAN_PPS, (maxRows * W * 0.95) / Math.max(1, b - a))));
  while (L.rows.length > maxRows && L.pps > SPAN_MIN_PPS) L = layout(Math.max(SPAN_MIN_PPS, L.pps * 0.92));
  const { pps, words, w } = L;
  const pos = (wi) => words.findIndex((w) => w.wi === wi);
  // 같은 층(구조 층끼리 / 나머지끼리)인데 지금 안 겹친 인서트는 넘지 못한다 - scripts/inserts.py update('span')과 같은 규칙
  const isStruct = (i) => i.decision?.layer === '구조' && ['top', 'list'].includes(i.decision?.layout);
  const others = S.items.filter((o) => o.id !== it.id && o.status !== 'rejected' && o.t_end > a && o.t_start < b)
    .map((o) => ({ form: o.form, x0: (o.t_start - a) * pps, x1: (o.t_end - a) * pps, wi_start: o.wi_start, wi_end: o.wi_end,
      block: isStruct(o) === isStruct(it) && !spanHit(o, it.wi_start, it.wi_end) }));
  const tr = { it, a, b, pps, words, others, s: pos(it.wi_start), e: pos(it.wi_end), edit: !busy && it.form !== 'video',
    w, W, rows: L.rows, cv: $('#spanCv'), sc, cols: null };
  spanTrack = tr;
  drawSpan(tr);
  sc.scrollTop = spanTop[it.id] ?? Math.max(0, spanPos(tr, words[tr.s].x0).cy - SPAN_GAP);
  sc.addEventListener('scroll', () => { spanTop[it.id] = sc.scrollTop; });
  const cvXY = (e) => { const r = tr.cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  tr.cv.addEventListener('mousemove', (e) => { if (!spanDrag) tr.cv.style.cursor = spanEdgeAt(tr, ...cvXY(e)) ? 'ew-resize' : 'pointer'; });
  tr.cv.addEventListener('mousedown', (e) => spanMouseDown(tr, e, cvXY));
  $('#spanPlay').addEventListener('click', () => {
    video.currentTime = tr.words[tr.s].s; spanStopAt = tr.words[tr.e].e; video.play();
  });

    try { await api('/api/insert/update', { id: it.id, action: 'sfx_vol', pct }); await refresh(); playSfxOf(it.id); } catch (err) { toast(err.message); }
  };
  box.querySelector('#dSfxVol')?.addEventListener('input', (e) => { $('#dSfxVal').textContent = `${e.target.value}%`; });
  box.querySelector('#dSfxVol')?.addEventListener('change', (e) => setVol(+e.target.value));
  box.querySelector('#dSfxAuto')?.addEventListener('click', () => setVol(null));
  box.querySelector('#dLayout')?.addEventListener('change', (e) => { $('#dSource').style.display = e.target.value === 'quote' ? '' : 'none'; });
  box.querySelector('#dApplyText')?.addEventListener('click', () => act(it, 'edit_text', {
    lines: $('#dLines').value.split('\n').map((s) => s.trim()).filter(Boolean),
    ...(box.querySelector('#dLayout') ? { layout: $('#dLayout').value, source: $('#dSource').value } : {}),
  }));
  box.querySelector('#dUpload')?.addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    toast('올리는 중…');
    const r = await fetch(`/api/insert/upload?id=${it.id}&name=${encodeURIComponent(f.name)}`, { method: 'POST', body: f });
    const j = await r.json(); if (!j.ok) return toast(j.error);
    await refresh(); toast('배치했어요 - 확인 후 승인하세요');
  });
}
async function act(it, action, extra = {}) {
  try {
    await api('/api/insert/update', { id: it.id, action, ...extra });
    if (action === 'delete') selId = null;
    if (action === 'approve' || (action === 'reject' && it.status !== 'approved')) {  // 결정하면 다음 확인 전 인서트로
      const next = sortedItems().find((i) => i.status === 'ready' && i.id !== it.id && (i.t_start ?? 0) >= (it.t_start ?? 0))
        || sortedItems().find((i) => i.status === 'ready' && i.id !== it.id);
      if (next) { selId = next.id; setTimeout(() => select(next.id, true), 0); }
    }
    await refresh();
    lastOv = '';
    if (['approve', 'reject', 'reopen'].includes(action)) toast({ approve: '승인했어요', reject: '취소했어요 - 내보내기에서 빠져요', reopen: '확인 전으로 되돌렸어요' }[action]);
    if (['regenerate', 'form'].includes(action)) toast('다시 만드는 중…');
    if (action === 'make') toast('만드는 중…');
    if (action === 'retry') toast('다시 시도하는 중…');
    if (action === 'cancel') toast('중단하는 중 - 지금 단계가 끝나면 멈춰요');
  } catch (e) { toast(e.message); }
}

// ---------------------------------------------------------------- 내보내기
$('#btnExport').addEventListener('click', async () => {
  const pending = S.items.filter((i) => i.status === 'ready').length;
  if (pending && !confirm(`확인 전 인서트 ${pending}개는 빠지고, 승인한 것만 들어갑니다. 내보낼까요?`)) return;
  try {
    const res = await fetch('/api/insert/export', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const r = await res.json();
    if (!r.ok) {
      showModal(`<h3 style="margin:0 0 8px">내보내지 못했어요</h3>${errorBlock(r.error_info || { title: r.error, hint: '다시 시도하세요', raw: '' })}
        <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="hideModal()">닫기</button><button class="primary" id="mRetry">다시 시도</button></div>`);
      $('#mRetry').addEventListener('click', () => { hideModal(); $('#btnExport').click(); });
      return;
    }
    showModal(`<h3 style="margin:0 0 8px">내보내기 완료</h3>
      <p>인서트 <b>${r.approved}개</b> · <code>${esc(r.fcpxml)}</code></p>
      <p class="note">이미 FCP로 가져온 뒤 다시 내보내면 FCP에는 새 프로젝트로 생겨요.</p>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="mReveal">Finder에서 보기</button><button class="primary" onclick="hideModal()">닫기</button></div>`);
    $('#mReveal').addEventListener('click', () => api('/api/insert/reveal'));
  } catch (e) { toast(e.message); }
});

document.addEventListener('keydown', (e) => {
  if (e.target.matches('textarea, input, select')) return;
  if (e.key === ' ') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
  if (e.key === 'Escape') { hideModal(); $('#mkBtn').style.display = 'none'; }
  if (modalOpen()) return;  // 팝업이 떠 있는 동안 ↑↓·A·X가 뒤의 인서트를 바꾸지 않게
  const cur = S?.items.find((i) => i.id === selId);
  if (e.key === 'ArrowDown') { e.preventDefault(); step(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
  if (cur && (e.key === 'a' || e.key === 'A') && cur.status === 'ready') act(cur, 'approve');   // 승인하고 다음 확인 전으로
  if (cur && (e.key === 'x' || e.key === 'X') && ['ready', 'approved', 'suggested'].includes(cur.status)) act(cur, 'reject');
});

load();
</script>
</body>
